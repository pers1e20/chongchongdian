    .rf-chip.active {
      background: rgba(139,155,174,0.18); border-color: rgba(139,155,174,0.45);
      color: var(--brand-gold); font-weight: 600;
    }

    /* 月份分组列表 + 区间统计 */
    .records-list-wrap { padding: 0 var(--sp-4) calc(96px + env(safe-area-inset-bottom)); margin-top: var(--sp-2); }
    .records-year-group { margin-top: var(--sp-5); }
    .records-year-group:first-child { margin-top: var(--sp-3); }
    .records-year-title {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 20px; font-weight: 800; color: rgba(255,255,255,0.92);
      padding: 0 var(--sp-2) var(--sp-2);
    }
    .records-year-title .ry-count { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.30); font-family: var(--font-mono); }
    .records-month-group { border-radius: var(--r-lg); overflow: hidden; margin-bottom: var(--sp-3); }
    .records-month-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-3) var(--sp-4); gap: var(--sp-3);
      background: rgba(139,155,174,0.08);
      border-bottom: 0.5px solid rgba(255,255,255,0.04);
    }
    .records-month-head .rm-title { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.85); flex-shrink: 0; }
    .records-month-head .rm-stats { display: flex; align-items: center; gap: var(--sp-3); flex: 1; justify-content: flex-end; min-width: 0; }
    .rm-stat { font-size: 12px; color: rgba(255,255,255,0.45); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rm-stat b { color: rgba(255,255,255,0.80); font-weight: 600; font-family: var(--font-mono); }
    .records-month-list {
      background: rgba(20,20,24,0.50);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 0.5px solid rgba(255,255,255,0.04);
      box-shadow: var(--shadow-sm), var(--specular-top);
    }

    /* 悬浮新增按钮（记录页） */

    

    /* ============================================================
       半屏数据弹层（图表点击展示当月/分类明细）
       ============================================================ */
    .data-sheet {
      position: fixed; inset: 0; z-index: 220;
      display: none; align-items: flex-end; justify-content: center;
    }
    .data-sheet.show { display: flex; }
    .data-sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.50); animation: fadeIn .18s ease; }
    .data-sheet-content {
      position: relative; width: 100%; max-width: 600px; max-height: 82vh; overflow-y: auto;
      border-radius: var(--r-2xl) var(--r-2xl) 0 0;
      padding: var(--sp-4) var(--sp-4) calc(24px + env(safe-area-inset-bottom));
      background: rgba(16,17,20,0.92);
      backdrop-filter: blur(30px) saturate(170%);
      -webkit-backdrop-filter: blur(30px) saturate(170%);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-bottom: none;
      box-shadow: 0 -18px 50px rgba(0,0,0,0.55);
      animation: slideUp .26s ease;
    }
    .data-sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 0 auto var(--sp-3); }
    .data-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
    .data-sheet-head h3 { font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.92); margin: 0; }
    .data-sheet-head .ds-sub { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .ds-close-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.60);
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .ds-close-btn svg { width: 16px; height: 16px; }
    .ds-hero {
      border-radius: var(--r-lg); padding: var(--sp-4); margin-bottom: var(--sp-3); text-align: center;
      background: linear-gradient(135deg, rgba(139,155,174,0.14), rgba(139,155,174,0.04));
      border: 0.5px solid rgba(139,155,174,0.20);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 26px rgba(139,155,174,0.08);
    }
    .ds-hero .dh-label { font-size: 12px; color: rgba(255,255,255,0.40); }
    .ds-hero .dh-value { font-size: 34px; font-weight: 800; font-family: var(--font-mono); color: var(--brand-gold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 2px 0; }
    .ds-hero .dh-sub { font-size: 12px; color: rgba(255,255,255,0.35); }
    .ds-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2);
      background: rgba(20,20,24,0.50);
      border-radius: var(--r-lg); padding: var(--sp-3);
      border: 0.5px solid rgba(255,255,255,0.04);
    }
    .ds-cell {
      border-radius: var(--r-md); padding: var(--sp-3);
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.04);
    }
    .ds-cell .dc-label { font-size: 11px; color: rgba(255,255,255,0.35); margin-bottom: 3px; }
    .ds-cell .dc-value { font-size: 17px; font-weight: 700; font-family: var(--font-mono); color: rgba(255,255,255,0.90); font-variant-numeric: tabular-nums; }
    .ds-cell .dc-unit { font-size: 11px; color: rgba(255,255,255,0.30); margin-left: 3px; font-family: var(--font-sans); font-weight: 500; }
    .ds-empty {
      border-radius: var(--r-lg); padding: var(--sp-6) var(--sp-4); text-align: center;
      background: rgba(20,20,24,0.50); border: 0.5px dashed rgba(255,255,255,0.10);
    }
    .ds-empty svg { width: 30px; height: 30px; color: rgba(255,255,255,0.20); margin-bottom: var(--sp-2); }
    .ds-empty .de-title { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.55); }
    .ds-empty .de-sub { font-size: 12px; color: rgba(255,255,255,0.30); margin-top: 4px; }
    .ds-note { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.30); background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
    .ds-note b { color: rgba(255,255,255,0.50); }

    /* 图表可点击提示 */
    
    .line-chart-dark { cursor: pointer; }
    .donut-row-dark { cursor: pointer; }
    
    /* ===== P1 新增：记录页本月条 / 说明 / 设置 ===== */
    .month-strip { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 16px; margin:2px 0 14px; border-radius:16px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); cursor:pointer; }
    .ms-value { font-size:26px; font-weight:600; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
    .ms-sub { font-size:12px; color:var(--text-secondary); margin-top:4px; }
    .ms-arrow { color:var(--text-muted); font-size:20px; }

    .ss-note { font-size:12px; color:var(--text-muted); padding:0 2px 18px; line-height:1.5; }
    .advice-summary-dark { display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
    .advice-summary-dark .as-arrow { color:var(--text-muted); }

    .sr-switch { background:none; border:1px solid rgba(255,255,255,.18); color:var(--text-secondary);
      font-size:11px; padding:3px 10px; border-radius:999px; margin-right:6px; }
    .settings-version { text-align:center; font-size:12px; color:var(--text-muted); padding:8px 0 24px; }

    .cf-last { font-size:12px; color:var(--text-secondary); padding:10px 2px 0; cursor:pointer; }
    .cf-more { width:100%; margin:14px 0 0; padding:12px 2px; background:none; border:none;
      color:var(--text-secondary); font-size:13px; text-align:left; }
    .cf-extra { display:none; }
    .cf-extra.open { display:block; }

    /* 趋势头部：窄屏下标题与指标切换分行，避免按钮逐字换行 */
    .trend-chart-dark .trend-head { flex-direction: column; align-items: stretch; gap: 10px; }
    .metric-seg { flex-shrink: 0; align-self: flex-start; }
    .metric-seg-item { white-space: nowrap; }
    .price-diff-hint span { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <!-- 顶部导航 -->

  <!-- 主内容 -->
  <main class="main">
    <section class="tab-panel active" id="panel-records"></section>
    <section class="tab-panel" id="panel-stats"></section>
    <section class="tab-panel" id="panel-settings"></section>
  </main>

  <!-- 底部导航：记录 | 记一笔 | 统计 -->
  <nav class="tabbar-dark">
    <button class="tab-item active" data-tab="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a2 2 0 0 1 2 2v18l-5-3-5 3V4a2 2 0 0 1 2-2z"></path></svg>
      <span class="tab-label">记录</span>
    </button>
    <button class="tab-add-btn" onclick="App.openChargePage()" aria-label="记一笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="tab-item" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l4-4 4 4 6-6"></path></svg>
      <span class="tab-label">统计</span>
    </button>
  </nav>

  <!-- 记一笔（独立覆盖页） -->
  <div class="page-overlay" id="chargeFormPage">
    <div class="page-header">
      <button class="page-back-btn" onclick="App.closeChargePage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      </button>
      <h2 id="chargeFormPageTitle">记一笔</h2>
      <span class="page-header-spacer" aria-hidden="true"></span>
    </div>
    <div class="page-body">
      <form id="chargeFormPage-form">
        <input type="hidden" id="cf_vehicleId">
        <input type="hidden" id="cf_chargeType" value="fast">
        <input type="hidden" id="cf_unitPrice">

        <div class="form-segment" id="cf_chargeTypeSegment">
          <button type="button" class="form-segment-btn" data-val="slow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0 M12 2v10" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            慢充
          </button>
          <button type="button" class="form-segment-btn active" data-val="fast">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" stroke-linecap="round" stroke-linejoin="round"></polygon></svg>
            快充
          </button>
        </div>

        <div class="form-list-dark">
          <div class="form-row-dark">
            <span class="fr-label">充入电量</span>
            <input type="number" id="cf_kWh" step="0.1" inputmode="decimal" class="fr-input" placeholder="45.5" required>
            <span class="fr-suffix">度</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">金额</span>
            <input type="number" id="cf_totalCost" step="0.01" inputmode="decimal" class="fr-input" placeholder="0.00">
            <span class="fr-suffix">元</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">日期</span>
            <input type="date" id="cf_date" class="fr-input" required>
          </div>
        </div>

        <div class="cf-last" id="cfLastHint" onclick="App.fillLastCharge()"></div>

        <button type="button" class="cf-more" id="cfMoreBtn" onclick="App.toggleChargeExtra()">补充信息（用于算电耗）</button>

        <div class="cf-extra" id="cfExtra">
          <div class="form-list-dark">
            <div class="form-row-dark">
              <span class="fr-label">充电前 SOC</span>
              <input type="number" id="cf_socBefore" min="0" max="100" class="fr-input" placeholder="20">
              <span class="fr-suffix">%</span>
            </div>
            <div class="form-row-dark">
              <span class="fr-label">充电后 SOC</span>
              <input type="number" id="cf_socAfter" min="0" max="100" class="fr-input" placeholder="85">
              <span class="fr-suffix">%</span>
            </div>
            <div class="form-row-dark">
              <span class="fr-label">里程表</span>
              <input type="number" id="cf_odometer" step="0.1" class="fr-input" placeholder="15200">
              <span class="fr-suffix">km</span>
            </div>
            <div class="form-row-dark" style="flex-direction:column;align-items:stretch;gap:6px;padding:14px 16px;">
              <textarea id="cf_note" placeholder="备注（可选）"></textarea>
            </div>
          </div>
        </div>

        <div class="record-btn-row">
          <button type="submit" class="btn-accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
            保存记录
          </button>
        </div>
      </form>
    </div>
  </div>



  <!-- 车辆详情（半屏） -->
  <div class="modal" id="vehicleDetailModal">
    <div class="modal-overlay"></div>
    <div class="modal-content" style="max-height:46vh;">
      <div class="modal-header">
        <h2>车辆详情</h2>
        <button class="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"></line><line x1="6" y1="18" x2="18" y2="6" stroke-linecap="round"></line></svg>
        </button>
      </div>
      <div id="vehicleDetailBody"></div>
      <div class="vehicle-detail-actions">
        <button class="btn btn-outline" id="vdEdit">✏️ 编辑车辆</button>
        <button class="btn btn-danger" id="vdDelete">🗑️ 删除车辆</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认面板 -->
  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-overlay" onclick="App.closeConfirm()"></div>
    <div class="confirm-panel">
      <div class="confirm-icon danger" id="confirmIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-text" id="confirmText">确定要执行此操作吗？</div>
      <div class="confirm-actions">
        <button class="btn btn-outline" onclick="App.closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>


  <!-- 图表数据半屏弹层 -->
  <div class="data-sheet" id="dataSheet">
    <div class="data-sheet-overlay" onclick="App.closeChartSheet()"></div>
    <div class="data-sheet-content">
      <div class="data-sheet-grab"></div>
      <div class="data-sheet-head">
        <div>
          <h3 id="dsTitle">数据明细</h3>
          <div class="ds-sub" id="dsSub"></div>
        </div>
        <button type="button" class="ds-close-btn" onclick="App.closeChartSheet()" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"></line><line x1="6" y1="18" x2="18" y2="6" stroke-linecap="round"></line></svg>
        </button>
      </div>
      <div id="dsBody"></div>
    </div>
  </div>

  <script src="charging-tracker.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          console.log('SW 注册成功', reg.scope);
        }).catch(function (err) {
          console.warn('SW 注册失败', err);
        });
      });
    }
  </script>

</body></html>
