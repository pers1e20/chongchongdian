<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>冲充电</title>
  <script>
    /* 样式表前应用主题，避免闪白 */
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('ev_theme_v1') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.pref = pref;
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBarMeta">
  <meta name="apple-mobile-web-app-title" content="冲充电">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    /* ============================================================
       冲充电 · 液态玻璃设计体系 v1.1
       结构：令牌 → 基础 → 布局 → 材质 → 原子组件 → 页面 → 弹层 → 动效 → 响应式
       规则：颜色只走令牌；光影只描述材质，不装饰内容
       ============================================================ */

    /* ---------- 1. 令牌 ---------- */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                   "Helvetica Neue", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-15: 15px;
      --fs-17: 17px; --fs-20: 20px; --fs-22: 22px; --fs-28: 28px; --fs-34: 34px;

      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
      --sp-6: 24px; --sp-8: 32px;
      --gutter: 20px;
      --r-ctrl: 10px; --r-card: 14px; --r-sheet: 22px; --r-capsule: 999px;
      --tabbar-h: 58px;
      --page-max: 600px;

      --dur-1: 120ms; --dur-2: 180ms; --dur-3: 240ms; --dur-4: 320ms;
      --ease: cubic-bezier(.32, .72, 0, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in: cubic-bezier(.4, 0, 1, 1);
      --ease-spring: cubic-bezier(.22, 1.12, .36, 1);
    }
    :root[data-theme="light"] {
      --c-bg: #F2F2F7;
      --c-surface: #FFFFFF;
      --c-surface-2: #FFFFFF;
      --c-fill: rgba(118,118,128,.10);
      --c-line: rgba(60,60,67,.16);
      --c-line-strong: rgba(60,60,67,.30);
      --c-text: #1C1C1E;
      --c-text-2: #5A5A5F;
      --c-text-3: #6E6E73;
      --c-placeholder: #A1A1A6;
      --c-selected: #FFFFFF;
      --c-ok: #1B7F4B; --c-warn: #9A5B00; --c-danger: #C7362F;
      --c-ok-fill: rgba(27,127,75,.10);
      --c-warn-fill: rgba(154,91,0,.10);
      --c-danger-fill: rgba(199,54,47,.10);
      --glass-tint: linear-gradient(180deg, rgba(255,255,255,.95), rgba(238,238,245,.90));
      --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.68), rgba(255,255,255,0) 44%);
      --glass-border: rgba(255,255,255,.80);
      --glass-rim: inset 0 1px 0 rgba(255,255,255,.98), inset 0 -1px 0 rgba(0,0,0,.05), inset 0 0 0 .5px rgba(255,255,255,.45);
      --glass-shadow: 0 18px 40px -16px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.08);
      --glass-chip: rgba(120,120,128,.12);
      --glass-card-rim: inset 0 1px 0 rgba(255,255,255,1);
      --surface-tint: linear-gradient(180deg, #FFFFFF, #F5F5F9);
      --hero-tint: linear-gradient(180deg, #FFFFFF, #F0F0F6);
      --rim-gradient: linear-gradient(150deg, rgba(255,255,255,.98), rgba(255,255,255,0) 38%, rgba(0,0,0,.06));
      --shadow-card: 0 1px 2px rgba(0,0,0,.05), 0 10px 26px -16px rgba(0,0,0,.28);
      --hero-glow: radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,1), rgba(255,255,255,0) 62%);
      --ambient-glow: radial-gradient(70% 38% at 50% 0%, rgba(255,255,255,.86), rgba(255,255,255,0) 72%);
      --solid-tint: linear-gradient(180deg, #34343A, #131315);
      --solid-rim: inset 0 1px 0 rgba(255,255,255,.22);
      --solid-shadow: 0 8px 20px -8px rgba(0,0,0,.45);
      --blur-chrome: blur(30px) saturate(180%);
      --scrim: rgba(0,0,0,.32);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --c-bg: #000000;
      --c-surface: #1C1C1E;
      --c-surface-2: #2C2C2E;
      --c-fill: rgba(118,118,128,.20);
      --c-line: rgba(255,255,255,.12);
      --c-line-strong: rgba(255,255,255,.24);
      --c-text: #FFFFFF;
      --c-text-2: #A6A6AC;
      --c-text-3: #9A9AA0;
      --c-placeholder: #6E6E73;
      --c-selected: #4A4A4D;
      --c-ok: #30D158; --c-warn: #FFB020; --c-danger: #FF6961;
      --c-ok-fill: rgba(48,209,88,.12);
      --c-warn-fill: rgba(255,176,32,.12);
      --c-danger-fill: rgba(255,105,97,.12);
      --glass-tint: linear-gradient(180deg, rgba(64,64,68,.92), rgba(22,22,24,.88));
      --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 42%);
      --glass-border: rgba(255,255,255,.20);
      --glass-rim: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.06);
      --glass-shadow: 0 18px 44px -14px rgba(0,0,0,.80), 0 2px 10px rgba(0,0,0,.50);
      --glass-chip: rgba(255,255,255,.16);
      --glass-card-rim: inset 0 1px 0 rgba(255,255,255,.07);
      --surface-tint: linear-gradient(180deg, #232326, #1A1A1C);
      --hero-tint: linear-gradient(180deg, #26262A, #19191C);
      --rim-gradient: linear-gradient(150deg, rgba(255,255,255,.26), rgba(255,255,255,0) 40%, rgba(0,0,0,.55));
      --shadow-card: 0 1px 2px rgba(0,0,0,.50), 0 12px 30px -18px rgba(0,0,0,.90);
      --hero-glow: radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.14), rgba(255,255,255,0) 62%);
      --ambient-glow: radial-gradient(70% 38% at 50% 0%, rgba(255,255,255,.05), rgba(255,255,255,0) 70%);
      --solid-tint: linear-gradient(180deg, #FFFFFF, #E6E6EA);
      --solid-rim: inset 0 1px 0 rgba(255,255,255,.95);
      --solid-shadow: 0 8px 20px -8px rgba(0,0,0,.8);
      --blur-chrome: blur(30px) saturate(165%);
      --scrim: rgba(0,0,0,.48);
      color-scheme: dark;
    }

    /* ---------- 2. 基础 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 15px; -webkit-text-size-adjust: 100%; background-color: var(--c-bg); }
    body {
      font-family: var(--font-sans);
      font-size: var(--fs-15);
      line-height: 1.5;
      color: var(--c-text);
      background-color: var(--c-bg);
      background-image: var(--ambient-glow);
      background-repeat: no-repeat;
      background-size: 100% 360px;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }
    @supports (overflow-x: clip) { body { overflow-x: clip; } }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { font-weight: 600; line-height: 1.25; }
    svg { display: block; }
    .i {
      width: 24px; height: 24px; flex-shrink: 0;
      fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .i-fill { fill: currentColor; stroke: none; }
    :focus-visible { outline: 2px solid var(--c-text); outline-offset: 2px; border-radius: 4px; }
    ::selection { background: var(--c-text); color: var(--c-bg); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--c-line-strong); border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- 3. 布局 ---------- */
    .main {
      max-width: var(--page-max);
      margin: 0 auto;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: panelIn 220ms var(--ease-out); }
    .body { padding: 0 var(--gutter); }

    /* ---------- 4. 材质层 ---------- */
    .nav {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 2px;
      height: calc(44px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 8px 0;
      background-image: var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      border-bottom: .5px solid var(--c-line);
      box-shadow: var(--glass-rim);
    }
    .nav-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      max-width: 60%; font-size: var(--fs-17); font-weight: 600;
      letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .nav-title-btn {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 2px;
      height: 44px; max-width: 62%; padding: 0 6px; border-radius: var(--r-ctrl);
      font-size: var(--fs-17); font-weight: 600; letter-spacing: -.01em;
    }
    .nav-title-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-title-btn .i { width: 15px; height: 15px; color: var(--c-text-3); }
    .nav-title-btn:active { background: var(--c-fill); }
    .nav-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: var(--r-ctrl); color: var(--c-text); flex-shrink: 0;
      position: relative;
    }
    .nav-btn:active { background: var(--c-fill); }
    .nav-btn .i { width: 21px; height: 21px; }
    .nav-btn .dot {
      position: absolute; top: 10px; right: 10px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--c-text);
    }
    .nav-text { width: auto; padding: 0 12px; font-size: var(--fs-15); font-weight: 500; }
    .nav-fill { flex: 1; }

    .tabbar {
      position: fixed; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 560px; height: var(--tabbar-h);
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 6px; z-index: 50;
      background-image: var(--glass-sheen), var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      border: .5px solid var(--glass-border);
      border-radius: 29px;
      box-shadow: var(--glass-rim), var(--glass-shadow);
    }
    .tab-item {
      position: relative; z-index: 1;
      flex: 1; height: 52px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      color: var(--c-text-3); border-radius: 18px;
      transition: color var(--dur-2) var(--ease);
    }
    .tab-indicator {
      position: absolute; top: 50%; left: 0; z-index: 0;
      width: 54px; height: 40px; margin-top: -20px;
      border-radius: 16px; background: var(--glass-chip);
      pointer-events: none;
      transition: transform var(--dur-4) var(--ease-spring), width var(--dur-4) var(--ease-spring);
    }
    .tab-item .i { width: 23px; height: 23px; }
    .tab-label { font-size: var(--fs-11); font-weight: 500; }
    .tab-item.active { color: var(--c-text); }
    .tab-item.active .tab-label { font-weight: 600; }
    .tab-item .ico-on { display: none; }
    .tab-item.active .ico-on { display: block; }
    .tab-item.active .ico-off { display: none; }
    .tab-add {
      position: relative; z-index: 2;
      width: 48px; height: 48px; flex-shrink: 0; margin: 0 8px;
      display: grid; place-items: center; border-radius: 50%;
      background-color: var(--c-text); background-image: var(--solid-tint);
      color: var(--c-bg);
      box-shadow: var(--solid-rim), var(--solid-shadow);
      transition: transform var(--dur-1) var(--ease);
    }
    .tab-add:active { transform: scale(.94); }
    .tab-add .i { width: 24px; height: 24px; }

    .action-bar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
      width: 100%; max-width: var(--page-max); z-index: 120;
      padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
      background-image: var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      border-top: .5px solid var(--c-line);
      box-shadow: var(--glass-rim);
    }

    /* ---------- 5. 原子组件 ---------- */
    .btn {
      height: 44px; padding: 0 20px; border-radius: var(--r-ctrl);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: var(--fs-15); font-weight: 500;
      transition: transform var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background-color: var(--c-text); background-image: var(--solid-tint);
      color: var(--c-bg);
      box-shadow: var(--solid-rim), var(--solid-shadow);
    }
    .btn-secondary { box-shadow: inset 0 0 0 1px var(--c-line-strong); color: var(--c-text); }
    .btn-danger { box-shadow: inset 0 0 0 1px var(--c-danger); color: var(--c-danger); }
    .btn-block { width: 100%; }
    .btn[disabled] { opacity: .35; pointer-events: none; }
    .btn .i { width: 18px; height: 18px; }

    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 50%; color: var(--c-text-2); flex-shrink: 0;
    }
    .icon-btn:active { background: var(--c-fill); }
    .icon-btn .i { width: 18px; height: 18px; }
    .icon-btn.danger { color: var(--c-danger); }

    .segmented { display: flex; gap: 2px; padding: 2px; background: var(--c-fill); border-radius: var(--r-ctrl); }
    .segmented button {
      flex: 1; min-width: 0; height: 32px; border-radius: 8px;
      font-size: var(--fs-13); font-weight: 500; color: var(--c-text-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .segmented button[aria-pressed="true"] {
      background: var(--c-selected); color: var(--c-text); font-weight: 600;
      box-shadow: 0 0 0 .5px var(--c-line);
    }
    .segmented.tabular button { padding: 0 2px; }

    .card {
      margin-top: var(--sp-3); padding: var(--sp-4);
      background-color: var(--c-surface); background-image: var(--surface-tint);
      border-radius: var(--r-card);
      box-shadow: var(--glass-card-rim), var(--shadow-card), inset 0 0 0 .5px var(--c-line);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
    .card-title { font-size: var(--fs-13); font-weight: 400; color: var(--c-text-3); }
    .card-link { display: inline-flex; align-items: center; gap: 1px; font-size: var(--fs-13); color: var(--c-text-3); }
    .card-link .i { width: 14px; height: 14px; }

    .group {
      background-color: var(--c-surface); background-image: var(--surface-tint);
      border-radius: var(--r-card); overflow: hidden;
      box-shadow: var(--glass-card-rim), var(--shadow-card), inset 0 0 0 .5px var(--c-line);
    }
    .group + .group { margin-top: 10px; }
    .row {
      display: flex; align-items: center; gap: var(--sp-3);
      width: 100%; min-height: 52px; padding: 8px 16px; text-align: left;
      border-bottom: .5px solid var(--c-line); font-size: var(--fs-15);
    }
    .row:last-child { border-bottom: 0; }
    .row:active { background: var(--c-fill); }
    .row-label { flex: 1; min-width: 0; }
    .row-value { font-size: var(--fs-13); color: var(--c-text-3); white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
    .row.danger .row-label { color: var(--c-danger); }
    .row .badge-current {
      font-size: var(--fs-11); color: var(--c-text-3);
      box-shadow: inset 0 0 0 .5px var(--c-line-strong);
      padding: 1px 6px; border-radius: 4px;
    }

    .switch {
      appearance: none; -webkit-appearance: none;
      width: 44px; height: 28px; flex-shrink: 0; margin-left: auto;
      border-radius: var(--r-capsule); background: var(--c-fill);
      border: .5px solid var(--c-line-strong); position: relative;
      transition: background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
    }
    .switch::before {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--c-surface); box-shadow: 0 0 0 .5px var(--c-line);
      transition: transform var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
    }
    .switch::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px; transform: translate(-50%, -50%);
    }
    .switch:checked { background: var(--c-text); border-color: var(--c-text); }
    .switch:checked::before { transform: translateX(16px); background: var(--c-bg); box-shadow: none; }
    /* 表单里的开关不能被 .field input 的 flex:1 / height:44px 拉长 */
    .field .switch { flex: 0 0 auto; width: 44px; height: 28px; margin-left: auto; }

    .tag {
      display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
      border-radius: 5px; box-shadow: inset 0 0 0 .5px var(--c-line-strong);
      font-size: var(--fs-11); color: var(--c-text-2); flex-shrink: 0;
    }

    .group-title { margin: var(--sp-6) 2px var(--sp-2); font-size: var(--fs-13); color: var(--c-text-3); }
    .group-title:first-child { margin-top: var(--sp-4); }
    .note-line { margin-top: var(--sp-2); padding: 0 2px; font-size: var(--fs-12); line-height: 1.5; color: var(--c-text-3); }

    /* ---------- 6. 记录页 ---------- */
    .summary {
      display: flex; align-items: center; gap: 10px;
      width: 100%; margin: var(--sp-3) 0 0; padding: 10px 14px; min-height: 56px;
      background-color: var(--c-surface); background-image: var(--surface-tint);
      border-radius: var(--r-card);
      box-shadow: var(--glass-card-rim), var(--shadow-card), inset 0 0 0 .5px var(--c-line); text-align: left;
    }
    .summary:active { background-color: var(--c-surface-2); }
    .summary-main { flex: 1; min-width: 0; display: block; }
    .summary-k { display: block; font-size: var(--fs-12); color: var(--c-text-3); }
    .summary-v { display: block; font-size: var(--fs-20); font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
    .summary-meta-inline { margin-left: 6px; font-size: var(--fs-12); font-weight: 400; color: var(--c-text-3); letter-spacing: 0; }
    .summary > .i { width: 16px; height: 16px; color: var(--c-text-3); }

    .year-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 22px 2px 8px; font-size: var(--fs-13); color: var(--c-text-3); }
    .year-head b { font-size: var(--fs-15); font-weight: 600; color: var(--c-text); }
    .year-head span { white-space: nowrap; }

    .group-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px 8px; border-bottom: .5px solid var(--c-line);
    }
    .group-head b { font-size: var(--fs-15); font-weight: 600; }
    .group-head span { font-size: var(--fs-12); color: var(--c-text-3); white-space: nowrap; }

    .record-row {
      display: flex; align-items: center; gap: var(--sp-3);
      width: 100%; min-height: 60px; padding: 10px 16px; text-align: left;
      border-bottom: .5px solid var(--c-line);
    }
    .record-row:last-child { border-bottom: 0; }
    .record-row:active { background: var(--c-fill); }
    .stagger .record-row {
      animation: rowIn var(--dur-4) var(--ease-out) both;
      animation-delay: calc(var(--i, 0) * 22ms);
    }
    .rec-icon {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center; background: var(--c-fill); color: var(--c-text-2);
    }
    .rec-icon .i { width: 18px; height: 18px; }
    .rec-main { flex: 1; min-width: 0; display: block; }
    .rec-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .rec-kwh { font-size: var(--fs-17); font-weight: 600; letter-spacing: -.01em; }
    .rec-unit { font-size: var(--fs-12); color: var(--c-text-3); }
    .rec-sub { display: block; margin-top: 2px; font-size: var(--fs-12); color: var(--c-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rec-amount { font-size: var(--fs-17); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; flex-shrink: 0; }

    .empty { padding: 56px 20px; text-align: center; }
    .empty svg { width: 96px; height: 72px; margin: 0 auto; color: var(--c-text-3); opacity: .55; }
    .empty h3 { margin-top: 14px; font-size: var(--fs-17); }
    .empty p { margin-top: 4px; font-size: var(--fs-13); color: var(--c-text-3); }
    .empty .btn { margin-top: 18px; }

    /* ---------- 7. 统计页 ---------- */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: var(--sp-3) 0 2px; }
    .menu-btn {
      display: inline-flex; align-items: center; gap: 1px; height: 32px;
      padding: 0 8px 0 12px; border-radius: 9px;
      background: var(--c-fill); font-size: var(--fs-13); font-weight: 500;
    }
    .menu-btn .i { width: 14px; height: 14px; color: var(--c-text-3); }
    .toolbar-meta { font-size: var(--fs-13); color: var(--c-text-3); }

    .hero {
      position: relative; overflow: hidden;
      margin-top: var(--sp-2); padding: 20px 16px;
      background-color: var(--c-surface); background-image: var(--hero-tint);
      border-radius: var(--r-card);
      box-shadow: var(--glass-card-rim), var(--shadow-card), inset 0 0 0 .5px var(--c-line);
    }
    .hero > * { position: relative; z-index: 1; }
    .hero::before {
      content: ""; position: absolute; left: 0; right: 0; top: -60%; height: 180%;
      background-image: var(--glass-sheen), var(--hero-glow);
      opacity: .8; pointer-events: none;
      transform: translate3d(0, var(--py, 0px), 0);
    }
    .hero-num { font-variant-numeric: tabular-nums; }
    .hero::after, .tabbar::after, .sheet::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      padding: 1px; background: var(--rim-gradient);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    .hero-label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-13); color: var(--c-text-3); }
    .hero-value { margin-top: 6px; font-size: var(--fs-34); line-height: 1.12; font-weight: 600; letter-spacing: -.02em; }
    .hero-meta { margin-top: 8px; font-size: var(--fs-13); color: var(--c-text-3); }
    .delta { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: var(--fs-11); font-weight: 500; }
    .delta.up { color: var(--c-danger); background: var(--c-danger-fill); }
    .delta.down { color: var(--c-ok); background: var(--c-ok-fill); }
    .delta.flat { color: var(--c-text-3); background: var(--c-fill); }

    .chart { margin-top: 2px; }
    .chart-svg { width: 100%; height: 140px; display: block; overflow: visible; }
    .chart-line {
      fill: none; stroke: var(--c-text); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: drawLine 640ms var(--ease-out) forwards;
    }
    .chart-area { fill: var(--c-text); opacity: 0; stroke: none; animation: areaIn 480ms var(--ease-out) 120ms forwards; }
    .chart-pt { fill: var(--c-surface); stroke: var(--c-text); stroke-width: 1.5; }
    .chart-pt.last { fill: var(--c-text); }
    .chart-hit { fill: transparent; stroke: none; }
    .x-labels { position: relative; height: 16px; margin-top: 6px; font-size: var(--fs-11); color: var(--c-text-3); }
    .x-labels span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    .x-labels span:first-child { transform: translateX(0); }
    .x-labels span:last-child { transform: translateX(-100%); }
    .chart-empty {
      height: 140px; display: grid; place-items: center; padding: 12px;
      border: .5px dashed var(--c-line-strong); border-radius: var(--r-ctrl);
      font-size: var(--fs-12); line-height: 1.6; color: var(--c-text-3); text-align: center;
    }

    .donut-wrap { display: flex; align-items: center; gap: 20px; }
    .donut { width: 88px; height: 88px; flex-shrink: 0; }
    .donut .track { stroke: var(--c-fill); }
    .donut .seg-a { stroke: var(--c-text); }
    .donut .seg-b { stroke: var(--c-text-3); }
    .legend { flex: 1; min-width: 0; display: grid; gap: 5px; font-size: var(--fs-13); }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .legend i.a { background: var(--c-text); }
    .legend i.b { background: var(--c-text-3); }
    .legend b { margin-left: auto; font-weight: 600; }

    .price-hint {
      display: flex; align-items: flex-start; gap: 6px;
      margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--c-line);
      font-size: var(--fs-12); line-height: 1.5; color: var(--c-text-3);
    }
    .price-hint .i { width: 15px; height: 15px; color: var(--c-warn); margin-top: 1px; }
    .price-hint b { color: var(--c-text); font-weight: 600; }
    .price-hint.ok .i { color: var(--c-ok); }

    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric { position: relative; min-width: 0; padding: 6px 4px; text-align: center; }
    .metric + .metric::before { content: ""; position: absolute; left: 0; top: 16%; bottom: 16%; width: .5px; background: var(--c-line); }
    .metric b { display: block; min-height: 42px; font-size: var(--fs-20); font-weight: 600; letter-spacing: -.01em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric b em { font-style: normal; font-size: var(--fs-11); font-weight: 400; color: var(--c-text-3); margin-left: 2px; }
    .metric b em.long { display: block; margin: 1px 0 0; }
    .metric span { display: block; margin-top: 2px; font-size: var(--fs-11); color: var(--c-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .advice-list { display: block; }
    .advice-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: .5px solid var(--c-line); }
    .advice-item:first-child { padding-top: 0; }
    .advice-item:last-child { padding-bottom: 0; border-bottom: 0; }
    .advice-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; color: var(--c-text-3); }
    .advice-icon .i { width: 20px; height: 20px; }
    .advice-item.warn .advice-icon { color: var(--c-warn); }
    .advice-item.ok .advice-icon { color: var(--c-ok); }
    .advice-title { font-size: var(--fs-15); font-weight: 600; }
    .advice-text { margin-top: 2px; font-size: var(--fs-13); line-height: 1.5; color: var(--c-text-2); }

    /* ---------- 8. 设置页 ---------- */
    .appearance { padding: var(--sp-3) var(--sp-4); }

    /* ---------- 9. 表单页 ---------- */
    .page {
      position: fixed; inset: 0; z-index: 100; display: none;
      background-color: var(--c-bg); background-image: var(--ambient-glow);
      background-repeat: no-repeat; background-size: 100% 360px;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .page.show { display: block; }
    .page.show:not(.is-closing) { animation: pageIn var(--dur-4) var(--ease-out); }
    .page.is-closing { animation: pageOut 180ms var(--ease-in) forwards; }
    /* 表单页永远压在设置页之上：100 页面 < 110 表单页 < 200 弹层 < 250 确认框 < 300 Toast */
    .page.page-form { z-index: 110; }
    .page-body { padding: var(--sp-4) var(--gutter) calc(96px + env(safe-area-inset-bottom)); }
    .field-group {
      overflow: hidden; margin-bottom: var(--sp-3);
      background-color: var(--c-surface); background-image: var(--surface-tint);
      border-radius: var(--r-card);
      box-shadow: var(--glass-card-rim), var(--shadow-card), inset 0 0 0 .5px var(--c-line);
    }
    .field { display: flex; align-items: center; gap: var(--sp-3); min-height: 52px; padding: 4px 16px; border-bottom: .5px solid var(--c-line); }
    .field:last-child { border-bottom: 0; }
    .field label { width: 88px; flex-shrink: 0; font-size: var(--fs-15); color: var(--c-text-2); }
    .field input {
      flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; outline: 0;
      font-size: var(--fs-17); color: var(--c-text); text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .field input::placeholder { color: var(--c-placeholder); }
    .field input[type="date"] { min-height: 44px; }
    .field .suffix { font-size: var(--fs-13); color: var(--c-text-3); flex-shrink: 0; }
    .field.invalid { box-shadow: inset 0 0 0 1.5px var(--c-danger); border-radius: var(--r-ctrl); }
    .field.invalid label, .field.invalid input { color: var(--c-danger); }
    .field-note { margin: 8px 2px 0; min-height: 16px; font-size: var(--fs-12); color: var(--c-text-3); }
    .form-msg { margin: 8px 2px 0; font-size: var(--fs-12); color: var(--c-danger); }
    .form-msg:empty { display: none; }

    .last-hint {
      display: flex; align-items: center; gap: 8px;
      min-height: 44px; margin: var(--sp-3) 0; padding: 8px 12px;
      border-radius: var(--r-ctrl); background: var(--c-fill);
      font-size: var(--fs-12); color: var(--c-text-2);
    }
    .last-hint .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .last-hint b { color: var(--c-text); font-weight: 600; }
    .last-hint .apply { min-height: 44px; font-size: var(--fs-13); font-weight: 600; color: var(--c-text); padding: 10px 4px; flex-shrink: 0; }

    .disclosure {
      display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px;
      padding: 8px 2px; font-size: var(--fs-13); color: var(--c-text-2); text-align: left;
    }
    .disclosure span { font-size: var(--fs-12); color: var(--c-text-3); }
    .disclosure .i { margin-left: auto; width: 16px; height: 16px; color: var(--c-text-3); transition: transform var(--dur-2) var(--ease); }
    .disclosure.open .i { transform: rotate(180deg); }
    .collapse { display: none; }
    .collapse.open { display: block; }
    .textarea-row { display: block; padding: 12px 16px; }
    .textarea-row textarea {
      width: 100%; min-height: 64px; border: 0; outline: 0; resize: vertical;
      background: transparent; color: var(--c-text); font-size: var(--fs-15); line-height: 1.5;
    }
    .textarea-row textarea::placeholder { color: var(--c-placeholder); }

    /* ---------- 10. 弹层 ---------- */
    .sheet-layer { position: fixed; inset: 0; z-index: 200; display: none; }
    .sheet-layer.show, .sheet-layer.is-closing { display: block; }
    .sheet-layer.is-closing { pointer-events: none; }
    .sheet-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 180ms var(--ease); }
    .sheet-layer.show .sheet-scrim { opacity: 1; }
    .sheet-layer.is-closing .sheet-scrim { opacity: 0; }
    .sheet {
      position: absolute; left: 50%; bottom: 0; width: 100%; max-width: var(--page-max);
      max-height: 82vh;
      max-height: 82dvh; display: flex; flex-direction: column;
      background-image: var(--glass-sheen), var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      border: .5px solid var(--glass-border); border-bottom: 0;
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      box-shadow: var(--glass-rim), var(--glass-shadow);
      transform: translate(-50%, 100%);
      transition: transform 200ms var(--ease-in);
    }
    .sheet-layer.show .sheet {
      transform: translate(-50%, 0);
      transition: transform 340ms var(--ease-spring);
    }
    .sheet-grab { width: 36px; height: 4px; border-radius: 2px; background: var(--c-line-strong); margin: 8px auto 0; flex-shrink: 0; }
    .sheet-head { display: flex; align-items: flex-start; gap: 6px; padding: 12px 12px 10px 20px; flex-shrink: 0; }
    .sheet-title-box { flex: 1; min-width: 0; }
    .sheet-title { font-size: var(--fs-17); font-weight: 600; letter-spacing: -.01em; }
    .sheet-sub { margin-top: 2px; font-size: var(--fs-12); color: var(--c-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-actions { display: flex; align-items: center; flex-shrink: 0; }
    .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px calc(24px + env(safe-area-inset-bottom)); }

    .ds-hero { padding: 14px; border-radius: 12px; background: var(--c-fill); text-align: center; margin-bottom: 12px; }
    .ds-hero .k { font-size: var(--fs-12); color: var(--c-text-3); }
    .ds-hero .v { margin: 2px 0; font-size: var(--fs-28); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
    .ds-hero .v em { font-style: normal; font-size: var(--fs-15); font-weight: 400; color: var(--c-text-3); margin-left: 2px; }
    .ds-hero .s { font-size: var(--fs-12); color: var(--c-text-3); }
    .ds-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .ds-cell { min-width: 0; padding: 10px 12px; border-radius: var(--r-ctrl); background: var(--c-fill); }
    .ds-cell .k { font-size: var(--fs-11); color: var(--c-text-3); }
    .ds-cell .v { margin-top: 2px; font-size: var(--fs-15); font-weight: 600; overflow-wrap: anywhere; }
    .ds-cell .v em { font-style: normal; font-size: var(--fs-11); font-weight: 400; color: var(--c-text-3); margin-left: 2px; }
    .ds-title { margin: 16px 0 8px; font-size: var(--fs-13); color: var(--c-text-3); }
    .ds-note { margin-top: 12px; font-size: var(--fs-12); line-height: 1.6; color: var(--c-text-3); }
    .ds-note b { color: var(--c-text-2); }
    .ds-empty { padding: 28px 12px; border: .5px dashed var(--c-line-strong); border-radius: 12px; text-align: center; font-size: var(--fs-13); line-height: 1.6; color: var(--c-text-3); }
    .sheet-list .row { padding-left: 0; padding-right: 0; }
    .sheet-list .row:first-child { border-top: 0; }
    .sheet-list .check { width: 18px; height: 18px; color: var(--c-text); margin-left: auto; }

    .dialog-layer { position: fixed; inset: 0; z-index: 250; display: none; place-items: center; padding: 24px; }
    .dialog-layer.show, .dialog-layer.is-closing { display: grid; }
    .dialog-layer.is-closing { pointer-events: none; }
    .dialog-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 180ms var(--ease); }
    .dialog-layer.show .dialog-scrim { opacity: 1; }
    .dialog-layer.is-closing .dialog-scrim { opacity: 0; }
    .dialog {
      position: relative; width: min(300px, 100%); padding: 20px 18px 16px; text-align: center;
      background-image: var(--glass-sheen), var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      border: .5px solid var(--glass-border); border-radius: 18px;
      box-shadow: var(--glass-rim), var(--glass-shadow);
      animation: dialogIn 220ms var(--ease-out);
    }
    .dialog-layer.is-closing .dialog { animation: dialogOut 160ms var(--ease-in) forwards; }
    @keyframes dialogIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes dialogOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.98); } }
    .dialog-icon { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--c-danger-fill); color: var(--c-danger); }
    .dialog-icon .i { width: 22px; height: 22px; }
    .dialog h2 { font-size: var(--fs-17); }
    .dialog p { margin-top: 6px; font-size: var(--fs-13); line-height: 1.5; color: var(--c-text-2); }
    .dialog-actions { display: flex; gap: 8px; margin-top: 18px; }
    .dialog-actions .btn { flex: 1; height: 42px; padding: 0 10px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
      transform: translate(-50%, 8px); z-index: 300;
      max-width: calc(100vw - 40px);
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 12px;
      background-image: var(--glass-sheen), var(--glass-tint);
      -webkit-backdrop-filter: var(--blur-chrome);
      backdrop-filter: var(--blur-chrome);
      box-shadow: var(--glass-rim), var(--glass-shadow);
      font-size: var(--fs-13); line-height: 1.4;
      opacity: 0; transition: opacity var(--dur-2), transform var(--dur-2);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .i { width: 16px; height: 16px; color: var(--c-ok); }
    .toast.warn .i { color: var(--c-warn); }
    .toast.error .i { color: var(--c-danger); }

    /* ---------- 10.5 补充原子类 ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      height: 30px; padding: 0 12px; border-radius: var(--r-capsule);
      box-shadow: inset 0 0 0 .5px var(--c-line-strong);
      font-size: var(--fs-13); color: var(--c-text-2);
    }
    .chip[aria-pressed="true"] { background: var(--c-text); color: var(--c-bg); box-shadow: none; }
    .chip-group { margin-bottom: 18px; }
    .chip-label { margin-bottom: 8px; font-size: var(--fs-12); color: var(--c-text-3); }
    .sheet-actions-row { display: flex; gap: 8px; margin-top: 20px; }
    .sheet-actions-row .btn { flex: 1; }

    .row > .i { width: 16px; height: 16px; color: var(--c-text-3); flex-shrink: 0; }
    .row > .check { margin-left: auto; width: 18px; height: 18px; color: var(--c-text); }
    .row.open > .i { transform: rotate(180deg); }
    .badge-current {
      font-size: var(--fs-11); color: var(--c-text-3);
      box-shadow: inset 0 0 0 .5px var(--c-line-strong);
      padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .card-link { padding: 6px 0; margin: -6px 0; font-size: var(--fs-13); color: var(--c-text-3); }
    .chart-svg { height: auto; aspect-ratio: 300 / 140; }
    .price-hint span { flex: 1; min-width: 0; }

    /* 紧凑控件的 44px 命中区（不改变视觉高度） */
    .segmented button, .menu-btn, .chip, .card-link { position: relative; }
    .segmented button::after, .menu-btn::after, .chip::after, .card-link::after {
      content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 44px; transform: translateY(-50%);
    }

    /* ---------- 10.9 关键帧 ---------- */
    @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pageIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes pageOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(12px); } }
    @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes areaIn { from { opacity: 0; } to { opacity: .06; } }
    ::view-transition-old(root), ::view-transition-new(root) {
      animation-duration: 280ms;
      animation-timing-function: var(--ease);
    }

    /* 弹层打开时关掉底层 blur，控制同屏模糊层数 */
    body.sheet-open .nav,
    body.sheet-open .tabbar,
    body.sheet-open .action-bar {
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    /* 不支持 backdrop-filter 时退回实色 */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .nav, .tabbar, .sheet, .dialog, .toast, .action-bar {
        background-image: none; background-color: var(--c-surface);
      }
    }

    /* ---------- 11. 动效降级 ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      .nav, .tabbar, .sheet, .action-bar, .toast, .dialog {
        -webkit-backdrop-filter: none; backdrop-filter: none;
        background-image: none; background-color: var(--c-surface);
        box-shadow: inset 0 0 0 .5px var(--c-line);
      }
    }
    @media (prefers-contrast: more) {
      :root[data-theme="light"] { --c-line: rgba(0,0,0,.35); --c-line-strong: rgba(0,0,0,.55); --c-text-3: #4A4A4F; }
      :root[data-theme="dark"] { --c-line: rgba(255,255,255,.30); --c-line-strong: rgba(255,255,255,.50); --c-text-3: #C7C7CC; }
    }

    /* ---------- 12. 响应式 ---------- */
    @media (min-width: 600px) {
      .tabbar { width: 560px; }
      .sheet { border-radius: var(--r-sheet) var(--r-sheet) 0 0; }
    }
    @media (max-width: 359px) {
      :root { --gutter: 16px; }
      .field label { width: 76px; }
    }
  </style>
</head>
<body>

  <main class="main">
    <section class="tab-panel" id="panel-records"></section>
    <section class="tab-panel active" id="panel-stats"></section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <span class="tab-indicator" aria-hidden="true"></span>
    <button class="tab-item active" data-tab="stats" aria-current="page">
      <svg class="i ico-off" aria-hidden="true"><use href="#i-tab-stats"/></svg>
      <svg class="i i-fill ico-on" aria-hidden="true"><use href="#i-tab-stats-fill"/></svg>
      <span class="tab-label">统计</span>
    </button>
    <button class="tab-add" onclick="App.openChargePage()" aria-label="记一笔">
      <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
    </button>
    <button class="tab-item" data-tab="records">
      <svg class="i ico-off" aria-hidden="true"><use href="#i-tab-records"/></svg>
      <svg class="i i-fill ico-on" aria-hidden="true"><use href="#i-tab-records-fill"/></svg>
      <span class="tab-label">记录</span>
    </button>
  </nav>

  <!-- 记一笔 -->
  <div class="page page-form" id="chargeFormPage">
    <div class="nav">
      <button class="nav-btn nav-text" onclick="App.closeChargePage()">取消</button>
      <span class="nav-fill"></span>
      <h1 class="nav-title" id="chargeFormPageTitle">记一笔</h1>
      <button class="nav-btn nav-text" type="submit" form="chargeFormPage-form">保存</button>
    </div>
    <form id="chargeFormPage-form" class="page-body" novalidate>
      <input type="hidden" id="cf_vehicleId">
      <input type="hidden" id="cf_chargeType" value="fast">
      <input type="hidden" id="cf_unitPrice">

      <div class="segmented" id="cf_chargeTypeSegment" role="group" aria-label="充电类型">
        <button type="button" data-val="slow" aria-pressed="false">慢充</button>
        <button type="button" data-val="fast" aria-pressed="true">快充</button>
      </div>

      <div style="height:12px"></div>

      <div class="field-group">
        <div class="field">
          <label for="cf_kWh">充入电量</label>
          <input id="cf_kWh" type="number" step="0.1" inputmode="decimal" placeholder="45.5">
          <span class="suffix">度</span>
        </div>
        <div class="field">
          <label for="cf_totalCost">金额</label>
          <input id="cf_totalCost" type="number" step="0.01" inputmode="decimal" placeholder="0.00">
          <span class="suffix">元</span>
        </div>
        <div class="field">
          <label for="cf_date">日期</label>
          <input id="cf_date" type="date">
          <span class="suffix"></span>
        </div>
      </div>

      <div class="field-note" id="cfPriceHint"></div>
      <div class="form-msg" id="cfFormMsg"></div>

      <div class="last-hint" id="cfLastHint"></div>

      <button type="button" class="disclosure" id="cfMoreBtn" onclick="App.toggleChargeExtra()">
        补充信息<span>用于算电耗</span>
        <svg class="i" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <div class="collapse" id="cfExtra">
        <div class="field-group">
          <div class="field">
            <label for="cf_socBefore">充电前 SOC</label>
            <input id="cf_socBefore" type="number" min="0" max="100" inputmode="numeric" placeholder="20">
            <span class="suffix">%</span>
          </div>
          <div class="field">
            <label for="cf_socAfter">充电后 SOC</label>
            <input id="cf_socAfter" type="number" min="0" max="100" inputmode="numeric" placeholder="85">
            <span class="suffix">%</span>
          </div>
          <div class="field">
            <label for="cf_odometer">里程表</label>
            <input id="cf_odometer" type="number" step="0.1" inputmode="decimal" placeholder="15200">
            <span class="suffix">km</span>
          </div>
          <div class="textarea-row">
            <textarea id="cf_note" placeholder="备注（可选）"></textarea>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <button type="submit" class="btn btn-primary btn-block">
          <svg class="i" aria-hidden="true"><use href="#i-check"/></svg>
          保存记录
        </button>
      </div>
    </form>
  </div>

  <!-- 车辆表单 -->
  <div class="page page-form" id="vehicleFormPage">
    <div class="nav">
      <button class="nav-btn nav-text" onclick="App.closeVehiclePage()">取消</button>
      <span class="nav-fill"></span>
      <h1 class="nav-title" id="vehicleModalTitle">添加车辆</h1>
      <button class="nav-btn nav-text" type="submit" form="vehicleForm">保存</button>
    </div>
    <form id="vehicleForm" class="page-body" novalidate>
      <div class="field-group">
        <div class="field">
          <label for="vf_name">车辆名称</label>
          <input id="vf_name" type="text" placeholder="如 智己 L6" autocomplete="off">
          <span class="suffix"></span>
        </div>
        <div class="field">
          <label for="vf_brand">品牌</label>
          <input id="vf_brand" type="text" placeholder="选填" autocomplete="off">
          <span class="suffix"></span>
        </div>
        <div class="field">
          <label for="vf_model">型号</label>
          <input id="vf_model" type="text" placeholder="选填" autocomplete="off">
          <span class="suffix"></span>
        </div>
        <div class="field">
          <label for="vf_batteryCapacity">电池容量</label>
          <input id="vf_batteryCapacity" type="number" step="0.1" min="0" inputmode="decimal" placeholder="75">
          <span class="suffix">kWh</span>
        </div>
        <div class="field">
          <label for="vf_maxChargePower">最大功率</label>
          <input id="vf_maxChargePower" type="number" step="1" min="0" inputmode="numeric" placeholder="120">
          <span class="suffix">kW</span>
        </div>
        <div class="field">
          <label for="vf_supportsFastCharge">支持快充</label>
          <input id="vf_supportsFastCharge" type="checkbox" class="switch" aria-label="支持快充">
          <span class="suffix"></span>
        </div>
        <div class="textarea-row">
          <textarea id="vf_note" placeholder="备注（可选）"></textarea>
        </div>
      </div>
      <div class="form-msg" id="vfFormMsg"></div>
      <p class="note-line">标称容量用于计算容量保持率；不填则关闭电池容量评估。</p>

      <div class="action-bar">
        <button type="submit" class="btn btn-primary btn-block">
          <svg class="i" aria-hidden="true"><use href="#i-check"/></svg>
          保存车辆
        </button>
      </div>
    </form>
  </div>

  <!-- 设置 -->
  <div class="page" id="settingsPage">
    <div class="nav">
      <button class="nav-btn" onclick="App.closeSettings()" aria-label="返回">
        <svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>
      </button>
      <span class="nav-fill"></span>
      <h1 class="nav-title">设置</h1>
      <span class="nav-fill"></span>
    </div>
    <div class="page-body" id="settingsBody"></div>
  </div>

  <!-- 通用弹层 -->
  <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
    <div class="sheet-scrim" onclick="App.closeSheet()"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <div class="sheet-title-box">
          <h2 class="sheet-title" id="sheetTitle">数据明细</h2>
          <div class="sheet-sub" id="sheetSub"></div>
        </div>
        <div class="sheet-actions" id="sheetActions"></div>
        <button class="icon-btn" onclick="App.closeSheet()" aria-label="关闭">
          <svg class="i" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="dialog-layer" id="confirmModal" role="presentation">
    <div class="dialog-scrim" onclick="App.closeConfirm()"></div>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="dialog-icon" id="confirmIcon">
        <svg class="i" aria-hidden="true"><use href="#i-alert"/></svg>
      </div>
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmText">确定要执行此操作吗？</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="App.closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>
