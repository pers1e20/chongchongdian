  <style>
    /* ============================================================
     * 清冷科幻 · 深空配色（设计规范 v1.0，统一深色，无明暗切换）
     * ============================================================ */
    :root {
      /* 石墨深色体系 */
      --c-bg: #0A0A0B;
      --c-surface: #141416;
      --c-surface-2: #1C1C1F;
      --c-line: #2A2A2E;
      --c-line-strong: #3A3A40;
      --c-text: #EDEDEF;
      --c-text-2: #9A9AA2;
      --c-text-3: #85858E;
      --c-accent: #5B9DFF;
      --c-ok: #3DD68C; --c-warn: #F0A63C; --c-danger: #F0616D;
      --c-ok-bg: rgba(61,214,140,.10); --c-warn-bg: rgba(240,166,60,.10);
      --c-danger-bg: rgba(240,97,109,.10); --c-accent-bg: rgba(91,157,255,.12);

      --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

      --fs-1: 11px; --fs-2: 13px; --fs-3: 15px; --fs-4: 20px; --fs-5: 32px;
      --r-1: 4px; --r-2: 8px; --r-3: 12px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --gutter: 16px; --tabbar-h: 56px; --page-max: 600px;
      --dur-1: 120ms; --dur-2: 180ms; --ease: cubic-bezier(.2,0,0,1);

      /* 旧变量别名（S7 清理） */
      --bg: var(--c-bg); --bg-base: var(--c-bg); --bg-void: var(--c-bg);
      --bg-surface: var(--c-surface); --bg-elevated: var(--c-surface-2); --card: var(--c-surface);
      --text: var(--c-text); --text-primary: var(--c-text); --label-primary: var(--c-text);
      --text-secondary: var(--c-text-2); --text-sub: var(--c-text-2);
      --text-light: var(--c-text-2); --label-secondary: var(--c-text-2);
      --text-muted: var(--c-text-3); --label-tertiary: var(--c-text-3);
      --border: var(--c-line); --border-default: var(--c-line); --border-subtle: var(--c-line);
      --separator: var(--c-line); --separator-strong: var(--c-line-strong); --border-light: var(--c-line-strong);
      --primary: var(--c-text-2); --primary-light: #B4B4BC; --primary-dark: #D2D2D8; --primary-bg: var(--c-surface-2);
      --accent-frost: var(--c-text-2); --accent-steel: #55657A; --accent-mist: var(--c-text-3);
      --brand-gold: var(--c-text-2); --brand-gold-soft: var(--c-surface-2);
      --success: var(--c-ok); --warning: var(--c-warn); --error: var(--c-danger);
      --green: var(--c-ok); --green-bg: var(--c-ok-bg);
      --amber: var(--c-warn); --amber-bg: var(--c-warn-bg);
      --red: var(--c-danger); --red-bg: var(--c-danger-bg);
      --purple: var(--c-text-3); --purple-bg: var(--c-surface-2);
      --sys-green: var(--c-ok); --sys-red: var(--c-danger);
      --sys-blue: var(--c-accent); --sys-orange: var(--c-warn);
      --action-primary: #EDEDEF; --action-primary-hover: #E4E4E8; --action-primary-text: #0A0A0B;
      --radius: var(--r-3); --radius-sm: var(--r-1); --radius-md: var(--r-2);
      --radius-lg: var(--r-3); --radius-xl: var(--r-3); --radius-full: 9999px;
      --r-sm: var(--r-1); --r-md: var(--r-2); --r-lg: var(--r-3);
      --r-xl: var(--r-3); --r-2xl: var(--r-3); --r-capsule: 9999px;
      --sp-1: var(--space-1); --sp-2: var(--space-2); --sp-3: var(--space-3);
      --sp-4: var(--space-4); --sp-5: var(--space-5); --sp-6: var(--space-6);
      --sp-8: 32px; --sp-10: 40px;
      --shadow: 0 0 0 1px var(--c-line); --shadow-sm: 0 0 0 1px var(--c-line);
      --shadow-md: 0 0 0 1px var(--c-line); --shadow-lg: 0 0 0 1px var(--c-line);
      --shadow-surface: 0 0 0 1px var(--c-line); --shadow-elevated: 0 0 0 1px var(--c-line);
      --shadow-dialog: 0 0 0 1px var(--c-line); --shadow-float: 0 0 0 1px var(--c-line);
      --specular-top: inset 0 0 0 0 transparent; --specular-edge: inset 0 0 0 0 transparent;
      --specular-strong: inset 0 0 0 0 transparent; --glow-accent: none;
      --gradient-primary: var(--c-surface); --gradient-green: var(--c-surface);
      --gradient-purple: var(--c-surface); --gradient-amber: var(--c-surface); --gradient-hero: var(--c-surface);
      --ease-liquid: var(--ease); --ease-spring: var(--ease);
      --dur-fast: var(--dur-1); --dur-normal: var(--dur-2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: var(--fs-3); }
    body {
      font-family: var(--font-sans);
      background: var(--c-bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部导航 ===== */

    

    

    

    /* ===== 底部导航 ===== */

    
    .tab-btn.active { color: var(--primary-light); font-weight: 700; }
    .tab-btn.active svg { transform: translateY(-1px) scale(1.06); filter: drop-shadow(0 0 4px rgba(139,155,174,.5)); }
    .tab-btn.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 32px;
      height: 4px;
      border-radius: 0 0 var(--r-1) var(--r-1);
      background: var(--primary);
      box-shadow: none;
    }

    /* ===== 底部中央添加按钮（半透明玻璃 · 圆形 · 无脉动光晕） ===== */
    
    .tab-add-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--c-line-strong);
      border: 1px solid rgba(255,255,255,.16);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: var(--primary-light);
      box-shadow: none;
      transition: transform .15s;
    }
    .tab-add-btn svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
    .tab-add-btn:active { transform: scale(.94); }

    /* ===== 主内容 ===== */
    .main { max-width: 600px; margin: 0 auto; padding: 14px 14px calc(74px + env(safe-area-inset-bottom)); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== 卡片 ===== */

    

    /* ===== 图表卡片：卡片尺寸与其他卡保持一致，仅将图表展示区稍微拉宽 ===== */

    /* ===== 统计卡片 ===== */

    

    

    

    

    

    

    

    /* ===== 统计卡片详情弹窗 ===== */
    .stat-detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .stat-detail-head h3 { font-size: var(--fs-3); font-weight: 700; flex: 1; }
    .sd-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .sd-period { font-size: var(--fs-2); color: var(--text-secondary); margin-bottom: 14px; }
    .sd-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .sd-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-elevated); border-radius: var(--r-2); }
    .sd-label { font-size: var(--fs-2); color: var(--text-secondary); flex-shrink: 0; }
    .sd-value { font-size: var(--fs-3); font-weight: 700; color: var(--text-primary); font-family: var(--font-mono); text-align: right; word-break: break-all; }
    
    .sd-note { font-size: var(--fs-2); line-height: 1.7; color: var(--text-secondary); background: var(--primary-bg); border-radius: var(--r-2); padding: 12px; margin-top: 14px; }
    .sd-note b { color: var(--accent-frost); }

    /* ===== 图表 ===== */

    

    

    

    

    .legend-item { display: flex; align-items: center; gap: 6px; font-size: var(--fs-2); }

    /* ===== 年度筛选 ===== */

    
    .year-chip.active { background: var(--bg-elevated); border-color: var(--accent-frost); color: var(--accent-frost); font-weight: 600; }

    /* ===== 表格 ===== */

    

    

    /* ===== 徽章 ===== */

    .badge.slow { background: var(--primary-bg); color: var(--primary-dark); }
    .badge.fast { background: var(--amber-bg); color: #F59E0B; }

    /* ===== 按钮 ===== */
    .btn {
      padding: 10px 18px; border-radius: var(--r-2); border: none; font-size: var(--fs-3);
      font-weight: 600; cursor: pointer; transition: all .2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:active { transform: scale(.95); }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--gradient-primary); color: #fff; box-shadow: none; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }

    
    .btn-mini.danger { color: var(--red); border-color: #fecaca; }
    .btn-block { width: 100%; justify-content: center; }

    /* ===== 空状态 ===== */

    

    

    /* ===== 品牌头部 ===== */

    

    /* ===== 车型卡片 ===== */

    
    .vehicle-avatar {
      width: 44px; height: 44px; border-radius: var(--r-2);
      background: var(--gradient-primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .vehicle-avatar svg { width: 24px; height: 24px; color: #fff; }
    
    .vehicle-name { font-size: var(--fs-3); font-weight: 700; }
    .vehicle-meta { font-size: var(--fs-2); color: var(--text-sub); margin-top: 2px; }

    

    
    .vehicle-avatar.large { width: 52px; height: 52px; border-radius: var(--r-2); }
    .vehicle-avatar.large svg { width: 28px; height: 28px; }
    .vehicle-detail-head { display: flex; align-items: center; gap: 14px; padding: 6px 2px 14px; }
    .vehicle-detail-note {
      display: flex; align-items: flex-start; gap: 6px;
      background: var(--bg); padding: 10px 12px; border-radius: var(--r-2);
      font-size: var(--fs-2); color: var(--text-sub); line-height: 1.5; margin-bottom: 16px;
    }
    .vehicle-detail-note svg { width: 15px; height: 15px; color: var(--accent-frost); flex-shrink: 0; margin-top: 2px; }
    .vehicle-detail-actions { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border-light); }
    .vehicle-detail-actions .btn { flex: 1; justify-content: center; padding: 13px; }

    /* ===== 分段切换器 ===== */

    
    .segment-btn.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: none;
    }

    /* 容量分析卡片 */

    /* ===== 模态框 ===== */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal.show { display: flex; animation: fadeIn .2s; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .modal-content {
      position: relative; background: var(--card); width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto; border-radius: var(--r-3) var(--r-3) 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp .3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h2 { font-size: var(--fs-3); font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close svg { width: 18px; height: 18px; color: var(--text-sub); }

    /* ===== 表单 ===== */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { display: block; font-size: var(--fs-2); color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
    .input-wrap { position: relative; }
    .input-wrap .input-suffix {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: var(--fs-2); color: var(--text-light); pointer-events: none;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: var(--r-2); font-size: var(--fs-3); font-family: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: none;
    }
    .form-group input.with-suffix { padding-right: 48px; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; }
    .checkbox-group input { width: 18px; height: 18px; }
    .checkbox-group label { margin-bottom: 0; }

    .form-section-toggle.open svg { transform: rotate(180deg); }
    .form-section-collapse { display: none; }
    .form-section-collapse.open { display: block; }
    .form-submit {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      margin: 0 auto;
      max-width: 600px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: var(--c-surface);
      z-index: 20;
      box-sizing: border-box;
    }
    .form-submit .btn { width: 100%; padding: 13px; font-size: var(--fs-3); justify-content: center; }
    @keyframes btnShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .form-submit .btn.shake { animation: btnShake .45s ease; }

    /* ===== 设置列表 ===== */

    

    

    

    .migration-note {
      background: var(--primary-bg); border: 1px solid rgba(59,130,246,0.30); border-radius: var(--radius-sm);
      padding: 14px; font-size: var(--fs-2); color: var(--text-sub); line-height: 1.7;
    }
    .migration-note strong { color: var(--text); }
    .migration-note code { background: rgba(59,130,246,0.15); padding: 1px 5px; border-radius: var(--r-1); font-size: var(--fs-2); }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(31,41,55,.92); color: #fff; padding: 10px 22px; border-radius: var(--r-3);
      font-size: var(--fs-3); z-index: 300; opacity: 0; transition: all .3s; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .toast svg { width: 16px; height: 16px; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 图表提示气泡 ===== */
    
    .chart-tooltip.show { opacity: 1; }

    /* ===== 充电记录卡片列表 ===== */

    

    
    .filter-chip.active { background: var(--accent-frost); color: #fff; }

    

    .charge-card.slow::before { background: var(--primary); }
    .charge-card.fast::before { background: var(--amber); }

    .charge-card.slow .charge-card-icon { background: var(--primary-bg); color: var(--primary); }
    .charge-card.fast .charge-card-icon { background: var(--amber-bg); color: var(--amber); }

    

    

    

    

    /* ===== 自定义确认面板 ===== */
    .confirm-modal {
      position: fixed; inset: 0; z-index: 250;
      display: none; align-items: flex-end; justify-content: center;
    }
    .confirm-modal.show { display: flex; animation: fadeIn .2s; }
    .confirm-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
    .confirm-panel {
      position: relative; background: var(--card); width: 100%; max-width: 600px;
      border-radius: var(--r-3) var(--r-3) 0 0; padding: 28px 20px calc(24px + env(safe-area-inset-bottom));
      animation: slideUp .3s ease;
    }
    .confirm-icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .confirm-icon.danger { background: var(--red-bg); color: var(--red); }
    .confirm-icon svg { width: 28px; height: 28px; }
    .confirm-title { text-align: center; font-size: var(--fs-3); font-weight: 700; margin-bottom: 8px; }
    .confirm-text { text-align: center; font-size: var(--fs-3); color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 12px; }
    .confirm-actions .btn { flex: 1; justify-content: center; padding: 13px; }
    .btn-danger { background: var(--red); color: #fff; }

    /* ===== 表单分段按钮 ===== */
    .form-segment {
      display: flex; gap: 8px;
    }
    .form-segment-btn {
      flex: 1; padding: 11px; border-radius: var(--r-2);
      border: 1.5px solid var(--border); background: var(--card);
      font-size: var(--fs-3); font-weight: 600; color: var(--text-sub);
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .form-segment-btn svg { width: 16px; height: 16px; }
    .form-segment-btn.active {
      border-color: var(--primary); background: var(--primary-bg);
      color: var(--primary-dark);
    }

    /* ===== Toast 变体 ===== */
    .toast.success { background: rgba(16,185,129,.92); }
    .toast.warn { background: rgba(245,158,11,.92); }

    /* ===== 骨架屏 ===== */
    
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ===== 图表入场动画 ===== */
    @keyframes barRise {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }
    @keyframes lineDraw {
      from { stroke-dashoffset: var(--len, 1000); }
      to { stroke-dashoffset: 0; }
    }

    /* ===== 响应式 ===== */
    @media (min-width: 600px) {

      .main { padding: 16px 20px calc(74px + env(safe-area-inset-bottom)); }

        left: 50%; right: auto; transform: translateX(-50%);
        width: 600px;
        border-left: 0.5px solid var(--c-line);
        border-right: 0.5px solid var(--c-line);
      }
    }

      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .page-overlay.show { display: block; transform: translateX(0); animation: slideInRight .25s ease; }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .page-header {
      background: var(--gradient-primary);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: none;
    }
    .page-back-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.18); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .page-back-btn:active { background: rgba(255,255,255,.28); }
    .page-back-btn svg { width: 20px; height: 20px; color: #fff; }
    .page-header h2 { font-size: var(--fs-3); font-weight: 700; }
    .page-body { max-width: 600px; margin: 0 auto; padding: 16px 14px calc(76px + env(safe-area-inset-bottom)); }

      color: var(--c-text); border-radius: var(--r-2); padding: 8px 16px; font-weight: 500; }

    .records-empty .re-btn { background: transparent; border: 1px solid var(--c-line-strong);
      color: var(--c-text); border-radius: var(--r-2); padding: 8px 16px; font-weight: 500; }

    /* 表单页直接呈现，避免低端机/省电模式下动画停在起始帧导致整屏空白 */
    .page-overlay.show { animation: none; transform: none; }

    /* 表单页直接呈现，避免低端机/省电模式下动画停在起始帧导致整屏空白 */
    .page-overlay.show { animation: none; transform: none; }
    /* ===== 车辆表单页（添加 / 编辑） ===== */
    #vehicleFormPage .vf-text { text-align: left; font-family: var(--font-sans); }
    #vehicleFormPage .form-row-textarea { flex-direction: column; align-items: stretch; gap: 6px; padding: 12px; }
    #vehicleFormPage textarea {
      width: 100%; min-height: 58px; resize: vertical;
      background: transparent; border: 0; outline: none;
      color: var(--c-text); font-family: var(--font-sans);
      font-size: var(--fs-3); line-height: 1.5;
    }
    #vehicleFormPage textarea::placeholder { color: var(--c-text-3); }
    #vehicleFormPage .vf-check {
      appearance: none; -webkit-appearance: none;
      width: 44px; height: 26px; margin-left: auto; flex-shrink: 0;
      border-radius: 9999px; background: var(--c-surface-2);
      border: 1px solid var(--c-line-strong);
      position: relative; cursor: pointer;
      transition: background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
    }
    #vehicleFormPage .vf-check::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--c-text-3);
      transition: transform var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
    }
    #vehicleFormPage .vf-check:checked { background: var(--c-text); border-color: var(--c-text); }
    #vehicleFormPage .vf-check:checked::after { transform: translateX(18px); background: var(--c-bg); }

    /* ============================================================
     * 窄屏防御层
     * 目标：把「溢出 / 重叠」这类不可控失效，统一改成「省略号」
     * 说明：前面几代样式存在同名类互相覆盖，因此本层置于最末，
     *       以相同或更高特异性覆盖，不改动历史规则。
     * ============================================================ */

    /* ---- 1. 全局横向兜底 ---- */
    html, body { overflow-x: hidden; max-width: 100%; }
    @supports (overflow-x: clip) {
      html, body { overflow-x: clip; }
    }
    body { min-height: 100dvh; }

    /* ---- 2. 顶栏：长车名走省略号，不换行不撑破 ---- */
    .home-nav-dark .nav-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .home-nav-dark .nav-btn { position: relative; }
    .home-nav-dark .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .home-nav-dark .nav-btn::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 100%; height: 44px; transform: translate(-50%, -50%);
    }

    /* ---- 3. Toast：长文案不超出视口 ---- */
    .toast {
      max-width: calc(100vw - 32px);
      white-space: normal;
      text-align: left;
      line-height: 1.45;
    }
    .toast span { min-width: 0; }

    /* ---- 4. 表单行：标签自适应，不再被截成「充电前 SO…」 ---- */
    .form-row-dark .fr-label {
      width: auto;
      min-width: 64px;
      max-width: 42%;
      white-space: normal;
      text-overflow: clip;
      line-height: 1.35;
    }
    .form-row-dark .fr-suffix { min-width: 1.4em; text-align: right; }

    /* ---- 5. 记录行：内容与金额互不挤压 ---- */
    .history-item-dark .hi-info { overflow: hidden; }
    .history-item-dark .hi-main {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .history-item-dark .hi-amount { min-width: 0; max-width: 46%; }

    /* ---- 6. 统计指标条：三格互不串位 ---- */
    .stats-summary-dark .ss-item { min-width: 0; }
    .stats-summary-dark .ss-v {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stats-summary-dark .ss-v em { display: block; margin-left: 0; }

    /* ---- 7. 月份组头：统计项收缩而非被硬裁 ---- */
    .records-month-head .rm-stat {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- 8. 弹层：两列网格可收缩，圆形按钮不被压扁 ---- */
    .ds-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ds-cell, .dc-value, .dc-label { min-width: 0; overflow-wrap: anywhere; }
    .ds-icon-btn { flex-shrink: 0; position: relative; }
    .ds-icon-btn::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px; transform: translate(-50%, -50%);
    }
    .data-sheet-head > div:first-child { min-width: 0; }
    .data-sheet-content { max-height: 82dvh; }

    /* ---- 9. 覆盖页：去掉负偏移装饰，避免产生横向滚动区 ---- */
    .page-overlay { overflow-x: hidden; }
    .page-overlay::before { left: 0; width: 100%; }

    /* ---- 10. 触摸目标：小控件扩到 44px 点击区，不改变视觉 ---- */
    .filter-toggle-btn, .sr-switch, .re-btn { position: relative; }
    .filter-toggle-btn::after, .sr-switch::after, .re-btn::after,
    .page-back-btn::after, .year-chip-dark::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 100%; height: 44px;
      transform: translate(-50%, -50%);
    }
    .page-back-btn, .year-chip-dark { position: relative; }
    .ds-close-btn { position: relative; }
    .ds-close-btn::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 100%; height: 44px; transform: translate(-50%, -50%);
    }
    .metric-seg-item { padding-top: 10px; padding-bottom: 10px; }
    .metric-seg-item { padding-top: 8px; padding-bottom: 8px; }
    .form-row-dark .fr-input { min-height: 40px; align-self: stretch; }
    .form-row-dark .fr-label { cursor: default; }

    /* ---- 11. 消除 2px 横向溢出与零散点击区 ---- */
    .home-nav-dark { margin-left: 0; margin-right: 0; }
    #cfMoreBtn { min-height: 44px; }
    #cfLastHint { position: relative; }
    #cfLastHint::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 100%; height: 44px; transform: translate(-50%, -50%);
    }
    #vehicleFormPage .vf-check { height: 28px; }
    #vehicleFormPage .vf-check::after { top: 3px; left: 3px; width: 20px; height: 20px; }
    #vehicleFormPage .vf-check:checked::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <!-- 顶部导航 -->

  <!-- 主内容 -->
  <main class="main">
    <section class="tab-panel active" id="panel-records"></section>
    <section class="tab-panel" id="panel-stats"></section>
    <section class="tab-panel" id="panel-settings"></section>
  </main>

  <!-- 底部导航：记录 | 记一笔 | 统计 -->
  <nav class="tabbar-dark">
    <button class="tab-item active" data-tab="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a2 2 0 0 1 2 2v18l-5-3-5 3V4a2 2 0 0 1 2-2z"></path></svg>
      <span class="tab-label">记录</span>
    </button>
    <button class="tab-add-btn" onclick="App.openChargePage()" aria-label="记一笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="tab-item" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l4-4 4 4 6-6"></path></svg>
      <span class="tab-label">统计</span>
    </button>
  </nav>

  <!-- 记一笔（独立覆盖页） -->
  <div class="page-overlay" id="chargeFormPage">
    <div class="page-header">
      <button class="page-back-btn" onclick="App.closeChargePage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      </button>
      <h2 id="chargeFormPageTitle">记一笔</h2>
      <span class="page-header-spacer" aria-hidden="true"></span>
    </div>
    <div class="page-body">
      <form id="chargeFormPage-form">
        <input type="hidden" id="cf_vehicleId">
        <input type="hidden" id="cf_chargeType" value="fast">
        <input type="hidden" id="cf_unitPrice">

        <div class="form-segment" id="cf_chargeTypeSegment">
          <button type="button" class="form-segment-btn" data-val="slow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0 M12 2v10" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            慢充
          </button>
          <button type="button" class="form-segment-btn active" data-val="fast">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" stroke-linecap="round" stroke-linejoin="round"></polygon></svg>
            快充
          </button>
        </div>

        <div class="form-list-dark">
          <div class="form-row-dark">
            <span class="fr-label">充入电量</span>
            <input type="number" id="cf_kWh" step="0.1" inputmode="decimal" class="fr-input" placeholder="45.5" required>
            <span class="fr-suffix">度</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">金额</span>
            <input type="number" id="cf_totalCost" step="0.01" inputmode="decimal" class="fr-input" placeholder="0.00">
            <span class="fr-suffix">元</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">日期</span>
            <input type="date" id="cf_date" class="fr-input" required>
          </div>
        </div>

        <div class="cf-last" id="cfLastHint" onclick="App.fillLastCharge()"></div>

        <button type="button" class="cf-more" id="cfMoreBtn" onclick="App.toggleChargeExtra()">补充信息（用于算电耗）</button>

        <div class="cf-extra" id="cfExtra">
          <div class="form-list-dark">
            <div class="form-row-dark">
              <span class="fr-label">充电前 SOC</span>
              <input type="number" id="cf_socBefore" min="0" max="100" class="fr-input" placeholder="20">
              <span class="fr-suffix">%</span>
            </div>
            <div class="form-row-dark">
              <span class="fr-label">充电后 SOC</span>
              <input type="number" id="cf_socAfter" min="0" max="100" class="fr-input" placeholder="85">
              <span class="fr-suffix">%</span>
            </div>
            <div class="form-row-dark">
              <span class="fr-label">里程表</span>
              <input type="number" id="cf_odometer" step="0.1" class="fr-input" placeholder="15200">
              <span class="fr-suffix">km</span>
            </div>
            <div class="form-row-dark" style="flex-direction:column;align-items:stretch;gap:6px;padding:14px 16px;">
              <textarea id="cf_note" placeholder="备注（可选）"></textarea>
            </div>
          </div>
        </div>

        <div class="record-btn-row">
          <button type="submit" class="btn-accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
            保存记录
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 车辆表单（独立覆盖页）：添加 / 编辑共用 -->
  <div class="page-overlay" id="vehicleFormPage">
    <div class="page-header">
      <button class="page-back-btn" onclick="App.closeVehiclePage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      </button>
      <h2 id="vehicleModalTitle">添加车辆</h2>
      <span class="page-header-spacer" aria-hidden="true"></span>
    </div>
    <div class="page-body">
      <form id="vehicleForm">
        <div class="form-list-dark">
          <div class="form-row-dark">
            <span class="fr-label">车辆名称</span>
            <input type="text" id="vf_name" class="fr-input vf-text" placeholder="如 智己 L6" required autocomplete="off">
          </div>
          <div class="form-row-dark">
            <span class="fr-label">品牌</span>
            <input type="text" id="vf_brand" class="fr-input vf-text" placeholder="选填" autocomplete="off">
          </div>
          <div class="form-row-dark">
            <span class="fr-label">型号</span>
            <input type="text" id="vf_model" class="fr-input vf-text" placeholder="选填" autocomplete="off">
          </div>
          <div class="form-row-dark">
            <span class="fr-label">电池容量</span>
            <input type="number" id="vf_batteryCapacity" step="0.1" min="0" inputmode="decimal" class="fr-input" placeholder="75" required>
            <span class="fr-suffix">kWh</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">最大功率</span>
            <input type="number" id="vf_maxChargePower" step="1" min="0" inputmode="numeric" class="fr-input" placeholder="120">
            <span class="fr-suffix">kW</span>
          </div>
          <div class="form-row-dark">
            <span class="fr-label">支持快充</span>
            <input type="checkbox" id="vf_supportsFastCharge" class="vf-check" aria-label="支持快充">
          </div>
          <div class="form-row-dark form-row-textarea">
            <textarea id="vf_note" placeholder="备注（可选）"></textarea>
          </div>
        </div>
        <div class="record-btn-row">
          <button type="submit" class="btn-accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
            保存车辆
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 车辆详情（半屏） -->
  <div class="modal" id="vehicleDetailModal">
    <div class="modal-overlay"></div>
    <div class="modal-content" style="max-height:46vh;max-height:46dvh;">
      <div class="modal-header">
        <h2>车辆详情</h2>
        <button class="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"></line><line x1="6" y1="18" x2="18" y2="6" stroke-linecap="round"></line></svg>
        </button>
      </div>
      <div id="vehicleDetailBody"></div>
      <div class="vehicle-detail-actions">
        <button class="btn btn-outline" id="vdEdit">✏️ 编辑车辆</button>
        <button class="btn btn-danger" id="vdDelete">🗑️ 删除车辆</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认面板 -->
  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-overlay" onclick="App.closeConfirm()"></div>
    <div class="confirm-panel">
      <div class="confirm-icon danger" id="confirmIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-text" id="confirmText">确定要执行此操作吗？</div>
      <div class="confirm-actions">
        <button class="btn btn-outline" onclick="App.closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>


  <!-- 图表数据半屏弹层 -->
  <div class="data-sheet" id="dataSheet">
    <div class="data-sheet-overlay" onclick="App.closeChartSheet()"></div>
    <div class="data-sheet-content">
      <div class="data-sheet-grab"></div>
      <div class="data-sheet-head">
        <div>
          <h3 id="dsTitle">数据明细</h3>
          <div class="ds-sub" id="dsSub"></div>
        </div>
        <button type="button" class="ds-close-btn" onclick="App.closeChartSheet()" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"></line><line x1="6" y1="18" x2="18" y2="6" stroke-linecap="round"></line></svg>
        </button>
      </div>
      <div id="dsBody"></div>
    </div>
  </div>

  <script src="charging-tracker.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 每次启动主动检查一次，避免长期停在旧缓存
          if (reg.update) reg.update().catch(function () {});
        }).catch(function (err) {
          console.warn('SW 注册失败', err);
        });
      });
    }
  </script>

</body></html>
