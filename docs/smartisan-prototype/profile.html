<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冲充电 · 我的</title><link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">
  <div class="phone">
    <header class="topbar">
      <button class="topbar__back icon-btn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="topbar__title">我的</h1>
      <span class="topbar__right"></span>
    </header>

    <main class="content">

      <!-- 当前车辆 -->
      <div class="card reveal">
        <div class="card-head"><h3>当前车辆</h3></div>
        <div class="veh-card">
          <div class="veh-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          </div>
          <div>
            <div id="vehName" style="font-size:16px;font-weight:700;color:var(--ink)">智己 L6</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px">智己汽车 · 定位中大型轿车</div>
            <div style="display:flex;gap:6px;margin-top:7px">
              <span class="chip chip--ink">标称容量 82 kWh</span>
              <span class="chip chip--fast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>支持快充</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 数据管理 -->
      <div>
        <div class="section-title reveal">数据管理</div>
        <div class="card reveal" style="margin-top:10px">
          <div class="listrow" data-toast="已从备份恢复 3 辆车 · 12 条记录">
            <div class="li-ic" style="color:var(--info);background:rgba(90,90,94,.08)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            </div>
            <div class="li-main"><div class="li-title">导入备份</div><div class="li-sub">从备份文件恢复充电与电量数据</div></div>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
          </div>
          <div class="listrow" data-toast="备份已导出 · 请妥善保存到本地">
            <div class="li-ic" style="color:var(--info);background:rgba(90,90,94,.08)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            </div>
            <div class="li-main"><div class="li-title">导出备份</div><div class="li-sub">导出当前全部记录为备份文件</div></div>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
          </div>
          <div class="listrow">
            <div class="li-ic" style="color:var(--info);background:rgba(90,90,94,.08)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            </div>
            <div class="li-main"><div class="li-title">云同步</div><div class="li-sub">多设备间自动同步记录</div></div>
            <button class="switch on" data-switch data-toast="云同步已开启" aria-label="云同步开关"></button>
          </div>
        </div>
      </div>

      <!-- 设置 -->
      <div>
        <div class="section-title reveal">设置</div>
        <div class="card reveal" style="margin-top:10px">
          <div class="listrow">
            <div class="li-ic" style="color:var(--gold-deep);background:var(--gold-soft)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </div>
            <div class="li-main"><div class="li-title">夜间主题</div><div class="li-sub">深夜低亮度护眼模式</div></div>
            <button class="switch" data-switch data-toast="夜间主题已开启" aria-label="夜间主题开关"></button>
          </div>
          <div class="listrow">
            <div class="li-ic" style="color:var(--info);background:rgba(90,90,94,.08)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="li-main"><div class="li-title">提醒开关</div><div class="li-sub">电量过低与定期充电提醒</div></div>
            <button class="switch on" data-switch data-toast="已开启；如需关闭请再次点击" aria-label="提醒开关"></button>
          </div>
          <div class="listrow" data-toast="冲充电 · 演示版 v1.0">
            <div class="li-ic" style="color:var(--red);background:var(--red-soft)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            </div>
            <div class="li-main"><div class="li-title">关于本应用</div><div class="li-sub">版本 1.0.0 · Smartisan OS 8.0 现代风格</div></div>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
          </div>
        </div>
      </div>

      <div class="note reveal" style="display:flex;align-items:flex-start;gap:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;color:var(--info);stroke-width:1.9;flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>所有数据仅保存在本机演示原型中，不向任何服务器上传。真实账号与支付请以正式版为准。</span>
      </div>

    </main>

    <nav class="tabbar">
    <a class="tabbar__item" data-nav="home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </a>
    <a class="tabbar__item" data-nav="records" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>记录</span>
    </a>
    <a class="tabbar__item" data-nav="analysis" href="analysis.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
      <span>分析</span>
    </a>
    <a class="tabbar__item" data-nav="profile" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </a>
  </nav>
  </div>

  <script src="mock.js"></script><script src="api.js"></script><script src="nav-active.js"></script>
  <script>
  (function () {
    // 车辆信息由 mock 统一提供
    var veh = DB.currentVehicleId ? DB.vehicles.find(function (v) { return v.id === DB.currentVehicleId; }) : DB.vehicles[0];
    var nameEl = document.getElementById('vehName');
    if (veh && nameEl) nameEl.textContent = veh.brand + ' ' + veh.name;

    // 轻提示 toast
    function toast(msg) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 20px -8px rgba(0,0,0,.3);opacity:0;transition:opacity .25s';
      document.body.appendChild(t);
      requestAnimationFrame(function () { t.style.opacity = '1'; });
      setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 260); }, 1700);
    }

    // listrow 点击提示
    document.querySelectorAll('.listrow[data-toast]').forEach(function (row) {
      row.style.cursor = 'pointer';
      row.addEventListener('click', function () {
        if (row.querySelector('[data-switch]')) return; // 开关可自绘，不重复提示
        toast(row.getAttribute('data-toast'));
      });
    });

    // 开关
    document.querySelectorAll('[data-switch]').forEach(function (sw) {
      sw.addEventListener('click', function (e) {
        e.stopPropagation();
        var on = sw.classList.toggle('on');
        console.log('[冲充电] 开关状态 ->', on);
        var msg = sw.getAttribute('data-toast');
        if (msg) toast(msg);
      });
    });
  })();
  </script>
</body>
</html>
