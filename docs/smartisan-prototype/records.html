<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冲充电 · 充电记录</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="records"><div class="phone">
  <header class="topbar">
    <button class="topbar__back icon-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 class="topbar__title">充电记录</h1>
    <span class="topbar__right"></span>
  </header>

  <main class="content">
    <div class="chiprow reveal" id="chiprow"></div>

    <div id="listBox"></div>

    <button class="btn btn--brand btn--block btn--lg reveal" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
      新增充电记录
    </button>
  </main>

  <nav class="tabbar">
    <a class="tabbar__item" data-nav="home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </a>
    <a class="tabbar__item" data-nav="records" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>记录</span>
    </a>
    <a class="tabbar__item" data-nav="analysis" href="analysis.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
      <span>分析</span>
    </a>
    <a class="tabbar__item" data-nav="profile" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </a>
  </nav>
</div>

<!-- 详情 Sheet -->
<div class="sheet-mask" id="detailMask"></div>
<div class="sheet" id="detailSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div>
      <h3 id="dTitle">充电详情</h3>
      <div id="dChip" style="margin-top:6px"></div>
    </div>
    <button class="icon-btn" id="dClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="dBody"></div>
  <div style="display:flex;gap:10px;margin-top:18px">
    <button class="btn btn--ghost" id="dEdit">编辑</button>
    <button class="btn btn--brand" id="dDel">删除</button>
  </div>
</div>

<!-- 新增 Sheet -->
<div class="sheet-mask" id="addMask"></div>
<div class="sheet" id="addSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h3>新增充电记录</h3>
    <button class="icon-btn" id="aClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="segmented" id="typeSeg" style="margin-bottom:14px">
    <button class="on" data-type="fast">快充</button>
    <button data-type="slow">慢充</button>
  </div>
  <div class="field">
    <label>金额（元）</label>
    <input type="number" inputmode="decimal" id="aCost" placeholder="如 63.2">
  </div>
  <div class="field">
    <label>充电度数（kWh）</label>
    <input type="number" inputmode="decimal" id="aKwh" placeholder="如 31.6">
  </div>
  <button class="btn btn--brand btn--block" id="aSave">保存记录</button>
</div>

<script src="mock.js"></script><script src="api.js"></script><script src="nav-active.js"></script>
<script>
/* ---------- 月份筛选 ---------- */
let curMonth = "2026-09";

function renderChips() {
  const box = document.getElementById("chiprow");
  box.innerHTML = "";
  DB.months.forEach(m => {
    const c = document.createElement("button");
    c.className = "chip" + (m === curMonth ? " on" : "");
    c.textContent = m.replace("-", " 年 ") + " 月";
    c.onclick = () => { curMonth = m; renderChips(); loadList(); };
    box.appendChild(c);
  });
}

/* ---------- 骨架屏 ---------- */
function showSkeleton() {
  const box = document.getElementById("listBox");
  box.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const row = document.createElement("div");
    row.className = "card";
    row.style.marginBottom = "12px";
    row.style.padding = "13px 16px";
    row.style.display = "flex";
    row.style.gap = "12px";
    row.style.alignItems = "center";
    row.innerHTML =
      '<div style="width:40px;height:40px;border-radius:12px;background:var(--panel)"></div>' +
      '<div style="flex:1">' +
        '<div style="height:12px;width:46%;background:var(--panel);border-radius:4px;margin-bottom:8px"></div>' +
        '<div style="height:10px;width:70%;background:var(--panel);border-radius:4px"></div>' +
      '</div>' +
      '<div style="width:52px;height:14px;background:var(--panel);border-radius:4px"></div>';
    box.appendChild(row);
  }
}

/* ---------- 列表渲染 ---------- */
function renderList(list) {
  const box = document.getElementById("listBox");
  box.innerHTML = "";
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "card empty";
    empty.innerHTML =
      '<div class="e-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div>' +
      '<h4>本月暂无充电记录</h4>' +
      '<p>点下方"新增充电记录"开始记一笔吧。</p>';
    box.appendChild(empty);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.style.padding = "6px 16px";
  list.forEach(c => card.appendChild(buildRow(c)));
  box.appendChild(card);
}

function buildRow(c) {
  const fast = c.type === "fast";
  const row = document.createElement("button");
  row.style.cssText = "display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left;background:none;border:none;color:inherit;font-family:inherit;cursor:pointer;border-top:1px solid var(--border)";
  row.onclick = () => openDetail(c);
  const icBg = fast ? "var(--red)" : "var(--gold)";
  const ic = fast
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/><line x1="6" x2="6" y1="11" y2="13"/><line x1="10" x2="10" y1="11" y2="13"/><line x1="14" x2="14" y1="11" y2="13"/></svg>';
  const dateShort = c.date.slice(5, 10).replace("-", "/");
  const weekday = new Date(c.date).getDay();
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][weekday];
  row.innerHTML =
    '<div class="li-ic" style="color:#fff;background:' + icBg + '">' + ic + '</div>' +
    '<div class="li-main">' +
      '<div class="li-title">' + dateShort + ' · ' + wd + '</div>' +
      '<div class="li-sub">' + c.kWh + ' kWh · 里程 ' + c.odometer + ' km</div>' +
    '</div>' +
    '<div class="li-meta">' +
      '<div class="li-val">¥' + c.cost.toFixed(2) + '</div>' +
      '<span class="chip ' + (fast ? "chip--fast" : "chip--slow") + '">' + (fast ? "快充" : "慢充") + '</span>' +
    '</div>';
  return row;
}

/* ---------- 加载 ---------- */
async function loadList() {
  showSkeleton();
  try {
    const res = await fetchCharges({ month: curMonth });
    renderList(res.data);
  } catch (e) { /* 静默失败 */ }
}

/* ---------- 详情 Sheet ---------- */
let current = null;

function openDetail(c) {
  current = c;
  const fast = c.type === "fast";
  document.getElementById("dTitle").textContent = c.date + " · " + (fast ? "快充" : "慢充");
  document.getElementById("dChip").innerHTML =
    '<span class="chip ' + (fast ? "chip--fast" : "chip--slow") + '">' + (fast ? "快充" : "慢充") + '</span>';
  const pricePer = (c.cost / c.kWh).toFixed(2);
  document.getElementById("dBody").innerHTML =
    '<div class="divider"></div>' +
    '<table class="tbl"><tbody>' +
      '<tr><th>充电度数</th><td class="metric" style="text-align:right">' + c.kWh + ' kWh</td></tr>' +
      '<tr><th>充电金额</th><td class="metric" style="text-align:right">¥ ' + c.cost.toFixed(2) + '</td></tr>' +
      '<tr><th>单度电价</th><td class="metric" style="text-align:right">¥ ' + pricePer + ' / 度</td></tr>' +
      '<tr><th>起始电量</th><td class="metric" style="text-align:right">' + c.socBefore + '%</td></tr>' +
      '<tr><th>结束电量</th><td class="metric" style="text-align:right">' + c.socAfter + '%</td></tr>' +
      '<tr><th>本次里程</th><td class="metric" style="text-align:right">' + c.odometer + ' km</td></tr>' +
    '</tbody></table>' +
    '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>备注：演示记录，本次为' + (fast ? "快充 120kW 桩" : "慢充 7kW 家桩") + '充电。</span></div>';
  openSheet("detail");
}

function openSheet(name) {
  document.getElementById(name + "Mask").classList.add("open");
  document.getElementById(name + "Sheet").classList.add("open");
}
function closeSheet(name) {
  document.getElementById(name + "Mask").classList.remove("open");
  document.getElementById(name + "Sheet").classList.remove("open");
}

/* ---------- 详情操作 ---------- */
document.getElementById("dClose").onclick = () => closeSheet("detail");
document.getElementById("detailMask").onclick = () => closeSheet("detail");

document.getElementById("dDel").onclick = async () => {
  await deleteCharge(current.id);
  closeSheet("detail");
  toast("已删除该条记录");
  loadList();
};
document.getElementById("dEdit").onclick = () => { closeSheet("detail"); toast("编辑功能演示中"); };

/* ---------- 新增 Sheet ---------- */
document.getElementById("addBtn").onclick = () => openSheet("add");
document.getElementById("aClose").onclick = () => closeSheet("add");
document.getElementById("addMask").onclick = () => closeSheet("add");

let newType = "fast";
document.getElementById("typeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  newType = b.dataset.type;
  document.querySelectorAll("#typeSeg button").forEach(x => x.classList.toggle("on", x === b));
});

document.getElementById("aSave").onclick = () => {
  const cost = parseFloat(document.getElementById("aCost").value);
  const kwh = parseFloat(document.getElementById("aKwh").value);
  if (isNaN(cost) || isNaN(kwh) || cost <= 0 || kwh <= 0) {
    toast("请填写有效的金额与度数");
    return;
  }
  const today = new Date().toISOString().slice(0, 10).slice(0, 7) === "2026-09"
    ? new Date().toISOString().slice(0, 10) : "2026-09-15";
  const c = {
    id: Date.now(), vehicleId: 1, date: today,
    type: newType, kWh: kwh, cost, odometer: 12480,
    socBefore: 30, socAfter: 100
  };
  DB.charges.push(c);
  closeSheet("add");
  document.getElementById("aCost").value = "";
  document.getElementById("aKwh").value = "";
  toast((newType === "fast" ? "快充" : "慢充") + "记录已保存");
  if (DB.months.indexOf(today.slice(0, 7)) === -1) {
    DB.months.unshift(today.slice(0, 7));
    curMonth = today.slice(0, 7);
    renderChips();
  }
  loadList();
};

/* ---------- Toast ---------- */
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;max-width:82%;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 1600);
}

renderChips();
loadList();
</script></body></html>
