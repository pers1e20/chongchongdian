        <div class="h-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        </div>
      </div>
      <div id="donutBox"></div>
      <div class="legend" style="justify-content:center">
        <span class="lg"><i style="background:var(--red)"></i>快充</span>
        <span class="lg"><i style="background:var(--gold)"></i>慢充</span>
      </div>
    </section>

    <div class="stat-grid reveal" id="statGrid"></div>

    <section class="card reveal" style="padding:8px 16px">
      <a href="health.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:inherit;border-top:1px solid var(--border)">
        <div class="h-ic" style="color:var(--red);background:var(--red-soft)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">电池健康</div>
          <div style="font-size:12px;color:var(--muted)">容量衰减情况与健康诊断</div>
        </div>
        <span class="chev" style="color:var(--disabled)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
      <a href="advice.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:inherit;border-top:1px solid var(--border)">
        <div class="h-ic" style="color:var(--gold-deep);background:var(--gold-soft)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">充电建议</div>
          <div style="font-size:12px;color:var(--muted)">基于习惯的补能策略建议</div>
        </div>
        <span class="chev" style="color:var(--disabled)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tabbar__item" data-nav="home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </a>
    <a class="tabbar__item" data-nav="records" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>记录</span>
    </a>
    <a class="tabbar__item" data-nav="analysis" href="analysis.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
      <span>分析</span>
    </a>
    <a class="tabbar__item" data-nav="profile" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </a>
  </nav>

<script src="mock.js"></script><script src="api.js"></script><script src="nav-active.js"></script>
<script>
let curMonth = "2026-09";
const ZAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>';
const WALLET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>';

function renderChips() {
  const box = document.getElementById("chiprow");
  box.innerHTML = "";
  DB.months.forEach(m => {
    const c = document.createElement("button");
    c.className = "chip" + (m === curMonth ? " on" : "");
    c.textContent = m.replace("-", " 年 ") + " 月";
    c.onclick = () => { curMonth = m; renderChips(); renderAll(); };
    box.appendChild(c);
  });
}

function prevMonth(m) {
  const i = DB.months.indexOf(m);
  return i > 0 ? DB.months[i - 1] : null;
}

function deltaPct(cur, prev) {
  if (prev == null || prev === 0) return null;
  return ((cur - prev) / prev) * 100;
}

function deltaHTML(cur, prev, fmt) {
  const d = deltaPct(cur, prev);
  if (d == null) return '<span class="st-delta" style="color:var(--muted)">暂无上期</span>';
  const up = d >= 0;
  const cls = up ? "up" : "down";
  const arrow = up
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>';
  return '<span class="st-delta ' + cls + '">' + arrow + fmt(Math.abs(d)) + '</span>';
}

function renderStats() {
  const box = document.getElementById("statGrid");
  const s = DB.summaryFor(curMonth);
  const pm = prevMonth(curMonth);
  const ps = pm ? DB.summaryFor(pm) : null;
  const avg = s.count ? s.kWh ? s.cost / s.kWh : 0 : 0;
  const avgPrev = (ps && ps.count && ps.kWh) ? ps.cost / ps.kWh : null;
  const cards = [
    {
      t: "t-red", ic: WALLET, label: "总费用（元）",
      val: s.cost.toFixed(2), delta: deltaHTML(s.cost, ps ? ps.cost : null, v => "上期 " + v.toFixed(0) + "%")
    },
    {
      t: "t-gold", ic: ZAP, label: "总度数（kWh）",
      val: s.kWh.toFixed(1), delta: deltaHTML(s.kWh, ps ? ps.kWh : null, v => "上期 " + v.toFixed(0) + "%")
    },
    {
      t: "t-ink", ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      label: "平均单价（元/度）",
      val: avg.toFixed(2), delta: deltaHTML(avg, avgPrev, v => "上期 " + v.toFixed(1) + "%")
    },
    {
      t: "t-plain", ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      label: "充电次数（次）",
      val: s.count, delta: deltaHTML(s.count, ps ? ps.count : null, v => "上期 " + v.toFixed(0) + "%")
    }
  ];
  box.innerHTML = cards.map(c =>
    '<div class="stat-card ' + c.t + '">' +
      '<div class="ic">' + c.ic + '</div>' +
      '<div class="st-label">' + c.label + '</div>' +
      '<div class="st-val">' + c.val + '</div>' +
      c.delta +
    '</div>').join("");
}

function renderTrend() {
  const box = document.getElementById("trendChart");
  const months = DB.months;
  const values = months.map(m => DB.summaryFor(m).cost);
  const max = Math.max.apply(null, values.concat([1])) * 1.18;
  const W = 340, H = 120, PADL = 34, PADR = 10, PADT = 14, PADB = 22;
  const cw = W - PADL - PADR, ch = H - PADT - PADB;
  const x = i => PADL + (values.length === 1 ? cw / 2 : cw * i / (values.length - 1));
  const y = v => PADT + ch - (v / max) * ch;
  const gv = 0, g1 = max / 2, g2 = max; // 3 gridlines
  let g = "";
  [0, 0.5, 1].forEach(k => {
    const gy = PADT + (1 - k) * ch;
    g += '<line class="gridline" x1="' + PADL + '" y1="' + gy + '" x2="' + (W - PADR) + '" y2="' + gy + '"/>';
  });
  let path = "", dots = "", labels = "";
  values.forEach((v, i) => {
    const px = x(i), py = y(v);
    path += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1) + " ";
    dots += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.4" fill="var(--surface)" stroke="var(--red)" stroke-width="2"/>';
    labels += '<text class="axis-label" x="' + px.toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + months[i].slice(2, 4) + "." + months[i].slice(5) + '</text>';
  });
  box.innerHTML =
    '<svg class="line-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g +
    '<polyline points="' + path + '" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + labels + '</svg>';
}

function renderDonut() {
  const box = document.getElementById("donutBox");
  const s = DB.summaryFor(curMonth);
  const total = s.kWh || 1;
  const fastP = (s.fast * 1) / (s.count || 1); // 按次数分布展示颜色面积近似
  // 按度数估算快充面积：快充单次度数更高，用次数+度数综合，这里以次数为比例
  const r = 56, C = 2 * Math.PI * r;
  const fastCirc = (s.fast / (s.count || 1)) * C;
  const slowCirc = C - fastCirc;
  box.innerHTML =
    '<div class="donut">' +
      '<svg viewBox="0 0 128 128">' +
        '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="var(--panel)" stroke-width="16"/>' +
        '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="var(--red)" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + slowCirc.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 64 64)"/>' +
        '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="var(--gold)" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + fastCirc.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(' + (-90 + slowCirc / C * 360) + ' 64 64)"/>' +
      '</svg>' +
      '<div class="d-center"><div><b>' + s.kWh.toFixed(1) + '</b><span>kWh · 共 ' + s.count + ' 次</span></div></div>' +
    '</div>';
}

function renderAll() {
  renderStats();
  renderTrend();
  renderDonut();
}

renderChips();
renderAll();
</script></body></html>
